<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Character sheet for Grei's OSRS-style tabletop one-shot. Pick Warrior, Ranger, Wizard or Priest and track HP, prayer, specials, gear, spells and turns.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Grei's One-Shot Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: a game-HUD sheet. Sticky turn bar, a row of OSRS-style stat orbs, then spellbook + prayers beside a side rail of runes, stats and pack. */
:root {
  --paper: #e9edf4;
  --panel: #f8f9fc;
  --ink: #18203a;
  --muted: #586178;
  --line: #cfd6e3;
  --robe: #2a47a3;
  --robe-ink: #ffffff;
  --robe-soft: #dde4f7;
  --hp: #c43a35;
  --pray: #1f8fb3;
  --spec: #c08a10;
  --exh: #7650a6;
  --track: #dde2ec;
  --bad: #b3261e;
  --bad-soft: #f8e1df;
  --good: #2c7a3a;
  --rune-air: #eceff3;
  --rune-water: #3567d6;
  --rune-earth: #7b5531;
  --rune-fire: #dc4526;
  --rune-mind: #e2801f;
  --rune-body: #4d7fd4;
  --rune-nature: #2d8b3a;
  --rune-law: #f3f6ff;
  --rune-chaos: #d1a422;
  --rune-death: #2a2a2e;
  --f-display: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-num: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0f1320;
    --panel: #171d2d;
    --ink: #e4e8f3;
    --muted: #97a0b8;
    --line: #2b3348;
    --robe: #7f99f2;
    --robe-ink: #0f1320;
    --robe-soft: #232d4d;
    --hp: #ee6a62;
    --pray: #59c6e8;
    --spec: #f0c04a;
    --exh: #b293e0;
    --track: #262e43;
    --bad: #ff8a80;
    --bad-soft: #3a1f22;
    --good: #74c983;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0f1320;
  --panel: #171d2d;
  --ink: #e4e8f3;
  --muted: #97a0b8;
  --line: #2b3348;
  --robe: #7f99f2;
  --robe-ink: #0f1320;
  --robe-soft: #232d4d;
  --hp: #ee6a62;
  --pray: #59c6e8;
  --spec: #f0c04a;
  --exh: #b293e0;
  --track: #262e43;
  --bad: #ff8a80;
  --bad-soft: #3a1f22;
  --good: #74c983;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--robe); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h2 { font-size: 1.3rem; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 0.84rem; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }

/* ---------- Turn bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.bar-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-right: auto; }
.who input {
  font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; background: transparent;
  border: 1px solid transparent; border-radius: 6px; padding: 0 6px; margin-left: -6px; width: 9.5em; max-width: 60vw;
}
.who input:hover { border-color: var(--line); }
.tag { font-size: 0.8rem; color: var(--muted); }
.turn { display: flex; align-items: center; gap: 8px; }
.turn-count { font-family: var(--f-num); font-size: 1.35rem; min-width: 4.2ch; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.status { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-s="saved"]::before { background: var(--good); }
.status[data-s="saving"]::before { background: var(--spec); }
.status[data-s="error"]::before { background: var(--bad); }

.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 7px;
  padding: 6px 11px; font-size: 0.88rem; line-height: 1.2; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--robe); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--robe); color: var(--robe-ink); border-color: var(--robe); font-weight: 700; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.tiny { padding: 3px 8px; font-size: 0.8rem; }
.btn.icon { padding: 3px 9px; min-width: 30px; }

input[type="number"], input[type="text"], textarea {
  background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px;
}
input[type="number"] { width: 4.2em; font-variant-numeric: tabular-nums; }

/* ---------- Page ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 0; display: flex; flex-direction: column; gap: 22px; }

/* Orbs */
.vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.orb {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center;
}
.ring {
  --pct: 1; width: 104px; aspect-ratio: 1; border-radius: 50%; position: relative; grid-row: span 2;
  background: conic-gradient(var(--c) calc(var(--pct) * 1turn), var(--track) 0);
  display: grid; place-items: center; max-width: 100%;
}
.ring::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--panel); }
.ring-in { position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.ring-in input {
  font-family: var(--f-num); font-size: 1.9rem; width: 2.6em; text-align: center; background: transparent;
  border: 1px solid transparent; padding: 0; border-radius: 6px; -moz-appearance: textfield; appearance: textfield;
}
.ring-in input::-webkit-outer-spin-button, .ring-in input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.ring-in input:hover, .ring-in input:focus { border-color: var(--line); }
.ring-in .of { font-family: var(--f-num); font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
.orb h3 { font-size: 1.05rem; color: var(--c); }
.orb-ctrl { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.orb-ctrl input { width: 3.4em; }
.orb-note { grid-column: 1 / -1; font-size: 0.78rem; color: var(--muted); }
.pips { display: flex; gap: 5px; flex-wrap: wrap; }
.pip {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper);
  font-family: var(--f-num); font-size: 0.8rem; padding: 0;
}
.pip.on { background: var(--exh); border-color: var(--exh); color: var(--panel); }

/* Combat styles: AC + modifiers */
.combat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 0.8fr); gap: 14px; }
@media (max-width: 1000px) { .combat { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .combat { grid-template-columns: minmax(0, 1fr); } }
.shield.speed { clip-path: none; border-radius: 50%; width: 68px; height: 68px; }
.shield.speed.slow { background: var(--bad-soft); color: var(--bad); }
.style-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center;
}
.style-card .label { grid-column: 1 / -1; }
.shield {
  width: 64px; height: 72px; display: grid; place-items: center; grid-row: span 2;
  background: var(--robe-soft); color: var(--robe);
  clip-path: polygon(50% 0, 100% 14%, 100% 52%, 50% 100%, 0 52%, 0 14%);
}
.shield .num { font-size: 1.7rem; line-height: 1; margin-top: -6px; }
.ac-break { font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 5px; }
.ac-break input { width: 3.2em; padding: 1px 4px; }
.ac-break .pray-bit { color: var(--pray); font-weight: 700; }
.mods { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.86rem; }
.mods b { font-family: var(--f-num); font-weight: 500; font-size: 1.1rem; color: var(--ink); margin-left: 3px; }
.mods .src-note { color: var(--muted); font-size: 0.76rem; }
.stats td.mod { font-family: var(--f-num); color: var(--muted); text-align: right; }

/* Long rest options */
.rest-panel {
  flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch;
  border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px;
}
.rest-opt { flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
.rest-opt b { font-family: var(--f-display); font-size: 1.05rem; }
.rest-opt p { margin: 0; font-size: 0.82rem; color: var(--muted); }
.rest-opt .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.rest-opt input { width: 3.6em; }

/* Armour, effects, shop */
.worn-name { font-weight: 700; }
.triple { font-family: var(--f-num); font-size: 0.92rem; color: var(--muted); white-space: nowrap; }
.wear-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.wear-row select { flex: 1; min-width: 10em; text-align: left; }
.wear-row input[type="number"] { width: 3.6em; }
.custom-armour { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.82rem; color: var(--muted); }
.custom-armour input[type="text"] { flex: 1; min-width: 8em; }
.custom-armour input[type="number"] { width: 3.4em; }
.effects { display: flex; flex-direction: column; gap: 6px; }
.effect { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.86rem; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--paper); }
.effect .amt { font-family: var(--f-num); }
.effect .amt.up { color: var(--good); }
.effect .amt.down { color: var(--bad); }
.effect .turns { color: var(--muted); margin-left: auto; }
.shop-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 0.88rem; }
.shop-row:first-child { border-top: 0; }
.price { font-family: var(--f-num); color: var(--muted); }

/* Main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.panel-head .sub { font-size: 0.82rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 0.8rem; }
.seg button[aria-pressed="true"] { background: var(--robe); color: var(--robe-ink); }

/* Spells */
.spells { display: flex; flex-direction: column; }
.spell {
  display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 9px 0; border-top: 1px solid var(--line);
}
.spell:first-child { border-top: 0; }
.lvl {
  font-family: var(--f-num); font-size: 1rem; text-align: center; border-radius: 6px; padding: 3px 0;
  background: var(--robe-soft); color: var(--robe); grid-row: span 2; align-self: start;
}
.spell.locked { opacity: 0.5; }
.spell.locked .lvl { background: var(--track); color: var(--muted); }
.spell-name { font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.spell-name .dmg { font-family: var(--f-num); font-weight: 500; color: var(--robe); font-size: 0.95rem; }
.kind { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; }
.badge-boost { font-size: 0.7rem; font-weight: 700; color: var(--spec); text-transform: uppercase; letter-spacing: 0.06em; }
.spell-fx { font-size: 0.84rem; color: var(--muted); grid-column: 2; }
.spell-cast { grid-row: span 2; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; align-self: center; }
.costs { display: flex; flex-wrap: wrap; gap: 4px; grid-column: 2 / -1; }
.rc {
  display: inline-flex; align-items: center; gap: 4px; font-size: 0.76rem; border: 1px solid var(--line);
  border-radius: 999px; padding: 1px 8px 1px 3px; background: var(--paper); white-space: nowrap;
}
.rc.short { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.rc.free { border-style: dashed; color: var(--muted); }
.rd { width: 13px; height: 13px; border-radius: 50%; background: var(--r); border: 1px solid rgba(0,0,0,0.28); display: inline-block; flex: none; }
.why { font-size: 0.74rem; color: var(--bad); text-align: right; max-width: 11em; }
@media (max-width: 520px) {
  .spell { grid-template-columns: 2.4rem minmax(0, 1fr); }
  .spell-cast { grid-row: auto; grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; }
  .why { text-align: left; max-width: none; }
}

/* Prayers */
.prayers { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.pr {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; text-align: left; align-items: start;
  border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 10px;
}
.pr:hover:not(:disabled) { border-color: var(--pray); }
.pr[aria-pressed="true"] { border-color: var(--pray); box-shadow: inset 0 0 0 1px var(--pray); background: color-mix(in srgb, var(--pray) 12%, var(--paper)); }
.pr:disabled { opacity: 0.45; cursor: not-allowed; }
.pr-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--pray); margin-top: 3px; grid-row: span 2; }
.pr[aria-pressed="true"] .pr-dot { background: var(--pray); }
.pr-name { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.pr-name .num { font-weight: 500; color: var(--pray); font-size: 0.85rem; white-space: nowrap; }
.pr-fx { font-size: 0.8rem; color: var(--muted); }
.drain { font-family: var(--f-num); color: var(--pray); }

/* Side rail */
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; }
.weapon { display: flex; flex-direction: column; gap: 10px; }
.weapon-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; justify-content: space-between; }
.weapon-name { font-weight: 700; font-size: 1.05rem; }
.ability { border-top: 1px solid var(--line); padding-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.ability b { font-family: var(--f-display); font-size: 1rem; }
.ability p { margin: 0; font-size: 0.82rem; color: var(--muted); grid-column: 1; }
.ability .btn { grid-row: 1 / span 2; grid-column: 2; }

.runes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.rune { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 9px; padding: 5px 6px; background: var(--paper); }
.rune .rd { width: 18px; height: 18px; }
.rune-name { flex: 1; font-size: 0.85rem; min-width: 0; }
.rune input { width: 3.3em; text-align: center; font-family: var(--f-num); padding: 2px 2px; }
.rune.inf input { color: var(--muted); }
.rune .btn.icon { padding: 1px 6px; min-width: 24px; }

.stats { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.stats th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; padding: 0 4px 6px; }
.stats td { padding: 4px; border-top: 1px solid var(--line); }
.stats td.eff { font-family: var(--f-num); font-size: 1.15rem; text-align: right; }
.stats td.eff.up { color: var(--good); }
.stats td.eff.down { color: var(--bad); }
.stats input { width: 3.4em; }
.table-wrap { overflow-x: auto; }

.items { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: center; }
.item:first-child { border-top: 0; }
.item input[type="text"] { width: 100%; background: transparent; border-color: transparent; padding-left: 0; font-weight: 700; }
.item input[type="text"]:hover, .item input[type="text"]:focus { border-color: var(--line); padding-left: 6px; }
.item-ctrl { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.item-ctrl input { width: 3.2em; text-align: center; }
.item-sub { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.item-sub input { width: 3.2em; }
.add-row { display: flex; gap: 6px; flex-wrap: wrap; }
.add-row input[type="text"] { flex: 1; min-width: 8em; }
.gp { display: flex; align-items: center; gap: 8px; }
.gp input { width: 5em; font-family: var(--f-num); }

.dice { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.roll-out { font-family: var(--f-num); font-size: 1.05rem; min-height: 1.4em; }
.roll-out b { font-size: 1.6rem; color: var(--robe); margin-left: 4px; }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.84rem; max-height: 260px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 8px; }
.log .t { font-family: var(--f-num); color: var(--muted); }
.empty { font-size: 0.85rem; color: var(--muted); font-style: italic; margin: 0; }

textarea { width: 100%; min-height: 190px; resize: vertical; line-height: 1.5; font-size: 0.88rem; }
.foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 0.92rem;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 20; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* ---------- Rulebook drawer ---------- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 15;
  width: min(560px, 100vw);
  background: var(--panel); border-left: 1px solid var(--line);
  box-shadow: -18px 0 40px rgba(10, 16, 35, 0.18);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

    const bloodied = hp > 0 && hp <= (pv.hpMax | 0) / 2, down = hp <= 0;
    net.api.patchEnemy(id, { bloodied, down }, { hp });
    pushShared(`${en.name} ${delta < 0 ? `took ${-delta}` : `healed ${delta}`} (${hp}/${pv.hpMax})`, true);
    if (down && !en.down) pushShared(`${en.name} is down`);
    else if (bloodied && !en.bloodied) pushShared(`${en.name} is bloodied`);
  }

  /* ---------- Bestiary: the DM's prepared enemies, kept on the DM's own device ---------- */
  const BEST_KEY = "greis-bestiary";
  const DICE_RE = /^\d+d\d+([+-]\d+)?$/i;
  let bestiary = (() => { try { const v = JSON.parse(localStorage.getItem(BEST_KEY) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } })();
  const saveBestiary = () => { try { localStorage.setItem(BEST_KEY, JSON.stringify(bestiary)); } catch (e) {} };
  const CARD_KEY = "greis-statblocks";
  let statCards = (() => { try { const v = JSON.parse(localStorage.getItem(CARD_KEY) || "{}"); return v && typeof v === "object" ? v : {}; } catch (e) { return {}; } })();
  function saveCards(add) {
    const next = Object.assign({}, statCards);
    for (const [k, v] of Object.entries(add || {})) if (typeof v === "string" && /^data:image\/(webp|png|jpeg);base64,/.test(v)) next[String(k).slice(0, 40)] = v;
    try { localStorage.setItem(CARD_KEY, JSON.stringify(next)); statCards = next; return true; }
    catch (e) { statCards = next; return false; }   // too big to keep: still usable until the page reloads
  }
  // "Goblin Minion 2" in a fight uses the "Goblin Minion" picture
  const cardFor = name => { const n = String(name || ""); return statCards[n] ? n : (m => m && statCards[m[1]] ? m[1] : null)(/^(.*) \d+$/.exec(n)); };
  const unquote = s => String(s == null ? "" : s).trim().replace(/^"(.*)"$/, "$1").trim();

  const AC_KINDS = ["melee", "ranged", "magic"];
  function parseAc(v) {
    const one = x => { const s = unquote(x).toLowerCase(); if (/^(immune|imm|-|–|none)$/.test(s)) return null; const n = parseInt(s, 10); return Number.isFinite(n) ? n : undefined; };
    if (v && typeof v === "object") {
      const o = {}; for (const k of AC_KINDS) { o[k] = v[k] === null ? null : one(v[k]); if (o[k] === undefined) return undefined; }
      return o;
    }
    const s = unquote(v);
    if (s.includes("/")) {
      const parts = s.split("/").map(one);
      if (parts.length !== 3 || parts.some(p => p === undefined)) return undefined;
      return { melee: parts[0], ranged: parts[1], magic: parts[2] };
    }
    const n = one(s);
    return n === null ? undefined : n;
  }
  // "12" for one AC, "12 melee · 12 ranged · 9 magic" for three
  const acLabel = (ac, html) => {
    const num = v => (html ? `<span class="num">${v}</span>` : String(v));
    if (ac === undefined || ac === null) return "?";
    if (typeof ac !== "object") return num(ac);
    return AC_KINDS.map(k => `${ac[k] === null || ac[k] === undefined ? "immune" : num(ac[k])} ${k}`).join(" · ");
  };
  const acCsv = ac => (ac && typeof ac === "object" ? AC_KINDS.map(k => (ac[k] === null || ac[k] === undefined ? "immune" : ac[k])).join("/") : ac);

  // Grei's monster stats (HP is separate). Initiative comes from AGI and spells from MGC, +1 per 10.
  const STAT_KEYS = [["att", "ATT"], ["str", "STR"], ["rng", "RNG"], ["mgc", "MGC"], ["pra", "PRA"], ["agi", "AGI"]];
  function readStats(o) {
    const from = o && typeof o.stats === "object" && o.stats ? o.stats : (o || {});
    const st = {};
    for (const [k, U] of STAT_KEYS) {
      const raw = from[k] !== undefined ? from[k] : from[U];
      const v = parseInt(unquote(raw), 10);
      if (raw !== undefined && unquote(raw) !== "" && Number.isFinite(v) && v >= 0) st[k] = Math.min(99, v);
    }
    return st;
  }
  const statsText = st => STAT_KEYS.filter(([k]) => st && st[k] !== undefined).map(([k, U]) => `${U} ${st[k]}`).join(" · ");
  const statsLine = p => [p.notes || "", statsText(p.stats)].filter(Boolean).join(" ");

  function cleanPreset(o, where) {
    const name = unquote(o.name).slice(0, 40);
    const hp = parseInt(unquote(o.hp), 10), ac = parseAc(o.ac);
    const stats = readStats(o);
    const initRaw = unquote(o.init !== undefined ? o.init : o.initBonus);
    const init = initRaw === "" && stats.agi !== undefined ? Math.floor(stats.agi / 10) : parseInt(initRaw.replace("+", ""), 10) || 0;
    const atkRaw = unquote(o.attack !== undefined && o.attack !== null ? o.attack : o.atk).replace(/\s/g, "");
    const atk = atkRaw === "" ? null : parseInt(atkRaw.replace("+", ""), 10);
    const dmg = unquote(o.damage !== undefined ? o.damage : o.dmg).replace(/\s/g, "");
    if (!name) return [null, `${where}: there's no name`];
    if (!(hp > 0)) return [null, `${where} (${name}): HP needs to be a number above 0`];
    if (ac === undefined) return [null, `${where} (${name}): AC needs to be a number, or melee/ranged/magic like 12/12/9`];
    if (atkRaw && !Number.isFinite(atk)) return [null, `${where} (${name}): the attack bonus should look like +4`];
    if (dmg && !DICE_RE.test(dmg)) return [null, `${where} (${name}): damage should look like 1d6+2`];
    const p = { name, hp, ac, init, atk: atkRaw ? atk : null, dmg: dmg.toLowerCase(), notes: unquote(o.notes).slice(0, 300) };
    const acts = cleanActions(o.actions);
    if (acts.length) p.actions = acts;
    if (o.multi) p.multi = unquote(o.multi).slice(0, 200);
    if (o.traits) p.traits = unquote(o.traits).slice(0, 600);
    if (/^https:\/\/www\.dndbeyond\.com\//.test(String(o.source || ""))) p.source = String(o.source).slice(0, 200);
    if (Object.keys(stats).length) p.stats = stats;
    const magic = stats.mgc !== undefined ? stats.mgc : parseInt(o.magic, 10);
    if (magic > 0) p.magic = Math.min(99, magic);
    return [p, null];
  }

  // Each action: name, kind (attack / save / other), to-hit, reach or range, damage dice and type, extra damage, and a note
  const AMT_RE = /^(\d+d\d+([+-]\d+)?|\d+)$/i;
  function cleanActions(list) {
    if (!Array.isArray(list)) return [];
    return list.slice(0, 12).map(a => {
      if (!a || typeof a !== "object") return null;
      const n = unquote(a.n || a.name).slice(0, 60);
      if (!n) return null;
      const k = ["attack", "save", "other"].includes(a.k) ? a.k : a.hit !== undefined && a.hit !== null ? "attack" : "other";
      const amt = v => { const s = unquote(v).replace(/\s/g, "").toLowerCase(); return AMT_RE.test(s) ? s : ""; };
      const hit = parseInt(String(a.hit === undefined || a.hit === null ? "" : a.hit).replace("+", ""), 10);
      const out = { n, k };
      if (k === "attack") { if (!Number.isFinite(hit)) return null; out.hit = hit; }
      if (a.reach) out.reach = unquote(a.reach).slice(0, 40);
      if (amt(a.dmg)) { out.dmg = amt(a.dmg); out.type = unquote(a.type).slice(0, 20); }
      if (amt(a.plus)) { out.plus = amt(a.plus); out.plusType = unquote(a.plusType).slice(0, 20); }
      if (a.note) out.note = unquote(a.note).slice(0, 400);
      if (a.dnd) out.dnd = unquote(a.dnd).slice(0, 80);
      return out;
    }).filter(Boolean);
  }
  // Rolls dice like 1d8+3, or a flat amount like 1
  const rollAmt = expr => (/^\d+$/.test(expr) ? { total: +expr, text: expr } : (r => r && { total: r.total, text: `${expr}: ${r.rolls.join("+")}${r.flat ? fmt(r.flat) : ""}` })(rollDice(expr)));
  const dmgLabel = a => [a.dmg ? `${a.dmg}${a.type ? " " + a.type : ""}` : "", a.plus ? `+ ${a.plus}${a.plusType ? " " + a.plusType : ""}` : ""].filter(Boolean).join(" ");
  // Text for the details list on a card
  const actionText = a => a.k === "attack"
    ? `${fmt(a.hit)} to hit${a.reach ? ", " + a.reach : ""}. Hit: ${dmgLabel(a)}${a.note ? ". " + a.note : ""}${a.dnd ? ` (${a.dnd})` : ""}`
    : (a.note || dmgLabel(a));
  // Editable copy of an enemy or bestiary entry. A single attack bonus becomes the first action.
  function draftFrom(p) {
    let actions = Array.isArray(p.actions) ? JSON.parse(JSON.stringify(p.actions)) : [];
    if (!actions.length && p.atk !== null && p.atk !== undefined) actions = [{ n: "Attack", k: "attack", hit: p.atk, dmg: p.dmg || "" }];
    actions.forEach(a => { if (a.k === "attack" && a.hit !== undefined && a.hit !== null) a.hit = fmt(a.hit | 0).replace("−", "-"); });
    return { name: p.name || "", hpMax: p.hp || "", ac: acCsv(p.ac === undefined ? "" : p.ac), init: fmt(p.init | 0).replace("−", "-"), ...Object.fromEntries(STAT_KEYS.map(([k]) => [k, p.stats && p.stats[k] !== undefined ? String(p.stats[k]) : k === "mgc" && p.magic ? String(p.magic) : ""])), multi: p.multi || "", actions };
  }
  const monsterSpells = magic => ((magic | 0) > 1 ? SPELLS.filter(s => s.l <= (magic | 0)) : []);
  function statBlockBits(name, source) {
    const c = cardFor(name);
    return (c ? btn("statblock", c, "Stat block", "tiny") : "")
      + (source ? ` <a class="small" href="${esc(source)}" target="_blank" rel="noopener">D&amp;D Beyond</a>` : "");
  }
  function actionDetails(p, name) {
    const items = [];
    const bits = statBlockBits(name || p.from || p.name, p.source);
    if (bits) items.push(`<li class="sb-row">${bits}</li>`);
    if (p.multi) items.push(`<li><b>Multiattack:</b> ${esc(p.multi)}</li>`);
    (p.actions || []).forEach(a => items.push(`<li><b>${esc(a.n)}:</b> ${esc(actionText(a))}</li>`));
    if (p.traits) items.push(`<li><b>Traits:</b> ${esc(p.traits)}</li>`);
    if (monsterSpells(p.magic).length) items.push(`<li><b>Spells:</b> Magic ${p.magic | 0}, so it can cast any spell up to level ${p.magic | 0} with ${fmt(Math.floor((p.magic | 0) / 10))} to hit and damage: ${esc(monsterSpells(p.magic).map(s => s.n).join(", "))}</li>`);
    return items.length ? `<details class="en-more"><summary>Actions and traits</summary><ul>${items.join("")}</ul></details>` : "";
  }

  // Column names a header row can use
  const HEADER_ALIAS = { name: "name", hp: "hp", hitpoints: "hp", ac: "ac", init: "init", initiative: "init", attack: "attack", tohit: "attack", damage: "damage", dmg: "damage", notes: "notes",
    att: "att", str: "str", strength: "str", rng: "rng", ranged: "rng", mgc: "mgc", magic: "mgc", pra: "pra", prayer: "pra", agi: "agi", agility: "agi" };
  // A line copied from Grei's MONSTER STATS or MONSTER AC pages, like "GOBLIN MINION: HP: 10, ATT: 10, ..." or "IMP: MELEE AC 12, RANGED AC 12, MAGIC AC 16, HP: 10"
  function parseGreiLine(raw) {
    const m = /^([^:,]{2,40}):\s*(.+)$/.exec(raw);
    if (!m) return null;
    const rest = m[2].replace(/\bMCG\b/gi, "MGC").replace(/(AC)\s*,\s*(\d)/gi, "$1 $2");
    if (!/\b(HP|ATT|STR|RNG|MGC|PRA|AGI)\s*:\s*\d|\b(MELEE|RANGED|MAGIC)\s+AC\b|IMMUNE TO NONMAGICAL/i.test(rest)) return null;
    const num = re => { const x = re.exec(rest); return x ? parseInt(x[1], 10) : undefined; };
    const nm = m[1].trim();
    const g = { name: nm === nm.toUpperCase() ? nm.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()) : nm, stats: {}, ac: {}, immune: /IMMUNE TO NONMAGICAL/i.test(rest) };
    g.hp = num(/\bHP\s*:\s*(\d+)/i);
    for (const [k, U] of STAT_KEYS) { const v = num(new RegExp("\\b" + U + "\\s*:\\s*(\\d+)", "i")); if (v !== undefined) g.stats[k] = v; }
    for (const k of AC_KINDS) { const v = num(new RegExp("\\b" + k + "\\s+AC\\s*(\\d+)", "i")); if (v !== undefined) g.ac[k] = v; }
    return g;
  }
  const mergeGrei = (a, b) => !a ? b : { name: a.name, hp: b.hp !== undefined ? b.hp : a.hp, stats: Object.assign({}, a.stats, b.stats), ac: Object.assign({}, a.ac, b.ac), immune: a.immune || b.immune };

  // Accepts JSON, CSV or a paste from a spreadsheet: name, HP, AC, initiative, attack, damage, notes
  function parsePresets(text) {
    const t = String(text || "").trim(), list = [], errors = [];
    let cards = null;
    if (!t) return { list, errors: ["There was nothing to import."] };
    if (t[0] === "[" || t[0] === "{") {
      try {
        let data = JSON.parse(t);
        if (!Array.isArray(data)) { if (data.cards && typeof data.cards === "object") cards = data.cards; data = data.enemies || data.bestiary || [data]; }
        data.forEach((o, i) => { const [p, e] = cleanPreset(o || {}, `Entry ${i + 1}`); if (p) list.push(p); else errors.push(e); });
      } catch (e) { errors.push("That looks like JSON but it couldn't be read. Check for a missing comma or bracket."); }
      return { list, errors, cards };
    }
    let header = null;
    const grei = new Map();
    t.split(/\r?\n/).forEach((line, i) => {
      const raw = line.trim();
      if (!raw || raw.startsWith("#")) return;
      const g = parseGreiLine(raw);
      if (g) { const k = g.name.toLowerCase(); grei.set(k, mergeGrei(grei.get(k), g)); return; }
      const cells = (raw.includes("\t") ? raw.split("\t") : raw.split(",")).map(unquote);
      if (/^name$/i.test(cells[0])) { header = cells.map(c => HEADER_ALIAS[c.toLowerCase().replace(/[^a-z]/g, "")] || null); return; }
      let o;
      if (header) {
        o = {};
        header.forEach((k, j) => { if (k && cells[j] !== undefined && cells[j] !== "") o[k] = cells[j]; });
        const ni = header.indexOf("notes");
        if (ni === header.length - 1) o.notes = cells.slice(ni).filter(Boolean).join(", ");   // notes can hold commas
      } else {
        const [name, hp, ac, init, attack, damage, ...rest] = cells;
        o = { name, hp, ac, init, attack, damage, notes: rest.join(", ") };
      }
      const [p, e] = cleanPreset(o, `Line ${i + 1}`);
      if (p) list.push(p); else errors.push(e);
    });
    // Grei's lines fill in or update a monster by name, keeping its attacks and anything else already set
    for (const g of grei.values()) {
      const base = bestiary.find(b => b.name.toLowerCase() === g.name.toLowerCase()) || list.find(b => b.name.toLowerCase() === g.name.toLowerCase());
      const o = base ? JSON.parse(JSON.stringify(base)) : { name: g.name };
      o.stats = Object.assign({}, base && base.stats, g.stats);
      if (g.hp !== undefined) o.hp = g.hp;
      if (Object.keys(g.ac).length || g.immune) {
        const prev = base && base.ac && typeof base.ac === "object" ? base.ac : {};
        o.ac = {};
        for (const k of AC_KINDS) o.ac[k] = g.ac[k] !== undefined ? g.ac[k] : g.immune && k !== "magic" ? null : prev[k] !== undefined ? prev[k] : null;
      }
      if (g.immune && !/immune to nonmagical/i.test(o.notes || "")) o.notes = ("Immune to nonmagical damage. " + (o.notes || "")).trim();
      if (o.stats.agi !== undefined) o.init = Math.floor(o.stats.agi / 10);
      if (o.ac === undefined) { errors.push(`${g.name}: no AC yet. Paste its line from MONSTER AC too`); continue; }
      if (!(o.hp > 0)) { errors.push(`${g.name}: no HP yet`); continue; }
      const [p, e] = cleanPreset(o, g.name);
      if (!p) { errors.push(e); continue; }
      const li = list.findIndex(b => b.name.toLowerCase() === p.name.toLowerCase());
      if (li >= 0) list[li] = p; else list.push(p);
    }
    if (!list.length && !errors.length) errors.push("No enemies found in that text.");
    return { list, errors };
  }

  function importPresets(text, source) {
    const { list, errors, cards } = parsePresets(text);
    let cardNote = "";
    if (cards) cardNote = saveCards(cards) ? `, ${Object.keys(cards).length} stat block pictures` : ", but the stat block pictures are too big to keep after a reload";
    let added = 0, updated = 0;
    for (const p of list) {
      const i = bestiary.findIndex(b => b.name.toLowerCase() === p.name.toLowerCase());
      if (i >= 0) { bestiary[i] = p; updated++; } else { bestiary.push(p); added++; }
    }
    saveBestiary();
    const parts = [];
    if (added) parts.push(`added ${added}`);
    if (updated) parts.push(`updated ${updated} with the same name`);
    ui.importMsg = { ok: !!(added || updated), text: `${source}: ${parts.join(", ") || "nothing imported"}${cardNote}.`, errors };
    if (added || updated) ui.bestText = "";
    render();
  }

  function bestiaryCsv() {
    const sgn = n => (n >= 0 ? "+" + n : String(n));
    return ["name,hp,ac,init,attack,damage,att,str,rng,mgc,pra,agi,notes"].concat(bestiary.map(p => [
      p.name.replace(/,/g, " "), p.hp, acCsv(p.ac), sgn(p.init | 0), p.atk === null || p.atk === undefined ? "" : sgn(p.atk), p.dmg || "",
      ...STAT_KEYS.map(([k]) => (p.stats && p.stats[k] !== undefined ? p.stats[k] : "")), String(p.notes || "").replace(/\r?\n/g, " ")
    ].join(","))).join("\n") + "\n";
  }

  function downloadText(filename, text, type) {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  function spawnPreset(p, n) {
    const taken = Object.values(net.enemies).filter(en => en && (en.name === p.name || en.name.startsWith(p.name + " "))).length;
    for (let i = 1; i <= n; i++) {
      const label = n === 1 && taken === 0 ? p.name : `${p.name} ${taken + i}`;
      net.api.setEnemy(net.api.newId(), { name: label, bloodied: false, down: false },
        { hp: p.hp, hpMax: p.hp, ac: p.ac, initBonus: p.init | 0, atk: p.atk === undefined ? null : p.atk, dmg: p.dmg || "", notes: p.notes || "",
          actions: p.actions || null, multi: p.multi || "", traits: p.traits || "", from: p.name, source: p.source || "", magic: p.magic | 0, stats: p.stats || null });
    }
  }

  const ui = {
    hpAmt: 1, ppAmt: 1, filter: "all", diceN: 1, diceMod: 0, newItem: "", newSkill: "", newName: "",
    resetArm: false, restOpen: false,
    wearPick: "", effStat: "magic", effAmt: 5, effTurns: 2, shop: 0, buyQty: 1, caName: "", caM: 0, caR: 0, caG: 0,
    adv: false, bloodied: false, far: false, beast: false, ammo: "", allyPick: "", allyWho: "",
    dc: 10, saveAdv: false, saveDis: false,
    joinCode: "", sessOpen: false, target: "", allyTo: "",
    enSpell: {}, eAmt: 5, enName: "", enHp: 10, enAc: "12", enInit: 0, enCount: 1, dmN: 1, dmMod: 0, dmSecret: false, dmLast: null,
    bestQ: "", bQty: 1, bestTool: "", bestText: "", importMsg: null, bestClearArm: false,
    bName: "", bHp: 10, bAc: "12", bInit: "", bAtk: "", bDmg: "", bNotes: ""
  };

  function readLocal(key) {
    try { const raw = localStorage.getItem(key); if (raw) return JSON.parse(raw); } catch (e) {}
    return null;
  }

  let docRef = null, saveTimer = null, writing = false, dirty = false;
  let status = { s: "local", text: "Saved in this browser" };

  function setStatus(s, text) {
    status = { s, text };
    const el = document.getElementById("status");
    if (el) { el.dataset.s = s; el.textContent = text; }
  }

  function persist() {
    // Any healing above 0 HP clears death saves
    if (state.cls && state.hp > 0 && state.death && (state.death.s || state.death.f)) state.death = { s: 0, f: 0 };
    state.savedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    if (inRoom() && !isDM()) schedulePublish();
    if (!docRef) return;
    setStatus("saving", "Saving…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 700);
  }

  async function flush() {
    if (!docRef) return;
    if (writing) { dirty = true; return; }
    writing = true;
    try {
      await docRef.set({ json: JSON.stringify(state), savedAt: state.savedAt });
      setStatus("saved", "Saved to your account");
    } catch (e) {
      const code = e && e.code;
      if (code === "unavailable") dirty = true;
      else if (code === "invalid_argument" || code === "not_granted" || code === "revoked") {
        // This viewer can't write here (for example view-only access): keep the browser copy
        docRef = null;
        setStatus("local", "Saved in this browser");
      } else setStatus("error", "Couldn't save to your account. Saved in this browser.");
    }
    writing = false;
    if (dirty && docRef) { dirty = false; setTimeout(flush, 600 + Math.random() * 600); }
  }

  function doneConnecting() { if (connecting) { connecting = false; if (!state.cls) render(); } }

  async function connect() {
    const giveUp = setTimeout(doneConnecting, 10000);
    const local = () => { clearTimeout(giveUp); setStatus("local", "Saved in this browser"); doneConnecting(); };
    if (!window.claude || typeof window.claude.use !== "function") return local();
    let dbNs = null, userNs = null;
    try { [dbNs, userNs] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) {}
    if (!dbNs || !userNs) return local();
    const uid = await userNs.id();
    if (!uid) return local();
    const ref = dbNs.doc("data/users/" + uid + "/character");
    const slow = setTimeout(() => setStatus("saving", "Can't reach your account yet. Saved in this browser."), 10000);
    try {
      const snap = await ref.get();
      let body = snap.exists ? snap.data() : null;
      if (!body) {
        // the sheet used to be wizard-only and saved under another name
        const old = await dbNs.doc("data/users/" + uid + "/wizard").get();
        if (old.exists) body = old.data();
      }
      clearTimeout(slow); clearTimeout(giveUp);
      docRef = ref;
      if (body && body.json && (body.savedAt || 0) > (state.savedAt || 0)) {
        state = migrate(JSON.parse(body.json));
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
        history = [];
        connecting = false;
        render();
        setStatus("saved", "Saved to your account");
        flush();
      } else if (state.savedAt) {
        setStatus("saving", "Saving…");
        flush();
      } else {
        setStatus("saved", "Changes save to your account");
      }
    } catch (e) {
      clearTimeout(slow);
      setStatus("local", "Saved in this browser");
    }
    clearTimeout(giveUp);
    doneConnecting();
  }

  function snapshot() { history.push(JSON.stringify(state)); if (history.length > 60) history.shift(); }
  function log(m) {
    state.log.unshift({ t: state.turn || 1, m });
    if (state.log.length > 80) state.log.length = 80;
    if (inRoom() && !isDM() && state.cls) pushShared(m);
  }
  function mutate(fn) {
    snapshot();
    const msg = fn();
    if (msg) log(msg);
    persist();
    render();
  }

  /* ================= Derived values ================= */
  const cdef = () => CLASSES[state.cls];
  const isCls = c => state.cls === c;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const toInt = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : 0; };
  const fmt = n => (n < 0 ? "−" : "+") + Math.abs(n);
  const d = s => 1 + Math.floor(Math.random() * s);

  const wornFx = () => state.worn.map(w => armourInfo(w.n)).filter(a => a && a.fx).map(a => a.fx);
  const fxSum = (field, key) => wornFx().reduce((a, fx) => a + ((fx[field] && fx[field][key]) || 0), 0);
  const gearLvl = k => fxSum("lvl", k);
  const ppLess = () => wornFx().reduce((a, fx) => a + (fx.ppLess || 0), 0);
  const avarice = () => state.worn.filter(w => (armourInfo(w.n) || {}).avarice).length;
  const wearing = n => state.worn.some(w => w.n.toLowerCase() === n.toLowerCase());
  const effSum = k => state.effects.filter(e => e.stat === k).reduce((a, e) => a + (e.amt | 0), 0);
  const eff = k => (state.stats[k].base | 0) + gearLvl(k) + effSum(k);
  const hpMax = () => Math.max(0, state.stats.hitpoints.base | 0);
  const ppMax = () => Math.max(0, state.stats.prayer.base | 0);
  const armourSum = s => state.worn.reduce((a, w) => a + (w[s] | 0), 0);
  const wielded = () => state.weapon ? (weaponInfo(state.weapon) || { n: state.weapon, dmg: "1d4", type: "other" }) : null;
  const runesOf = w => (w ? w.runes || (w.rune ? [w.rune] : []) : []);
  const freeRunes = () => runesOf(wielded());
  const isFree = r => freeRunes().includes(r);
  const runeList = rs => rs.map(r => RUNE_NAME[r].toLowerCase()).join(" and ");
  // Wind/Water/Earth/Fire spells are air/water/earth/fire; a matching battlestaff adds its bonus to their damage
  const SPELL_EL = { Wind: "air", Water: "water", Earth: "earth", Fire: "fire" };
  const spellEl = sp => SPELL_EL[sp.n.split(" ")[0]] || null;
  const staffSpellBonus = sp => { const w = wielded(), el = spellEl(sp); return (w && w.spellBonus && el && w.spellBonus[el]) || 0; };

  // Every 10 levels in a stat = +1 to its modifiers
  const mod = k => Math.floor(Math.max(0, eff(k)) / 10);
  const prayerBits = (field, style) => state.prayersOn.map(n => ({ n, b: PRAYER_BONUS[n] }))
    .concat(buffPrayers().map(x => ({ n: `${x.n} (${x.from})`, b: PRAYER_BONUS[x.n] })))
    .filter(x => x.b && x.b[field] === style);
  const prayerSum = (field, style) => prayerBits(field, style).reduce((a, x) => a + x.b.v, 0);
  const STYLE = {
    melee: { name: "Melee", hit: "attack", dmg: "strength" },
    ranged: { name: "Ranged", hit: "ranged", dmg: "ranged" },
    magic: { name: "Magic", hit: "magic", dmg: "magic" }
  };
  const hitMod = s => mod(STYLE[s].hit) + fxSum("hit", s);
  const dmgMod = s => mod(STYLE[s].dmg) + prayerSum("dmg", s) + fxSum("dmg", s);
  const acTotal = s => armourSum(s) + mod("defense") + prayerSum("ac", s);
  // Exhaustion (D&D 2024): -2 to every d20 roll and -5 ft speed per level; level 6 is death
  const d20Pen = () => 2 * (state.exh | 0);
  // Base speed 30 ft; each plate piece and each exhaustion level takes 5 ft off
  const platePieces = () => state.worn.filter(w => (armourInfo(w.n) || {}).note === PLATE).length;
  const speed = () => Math.max(0, 30 - 5 * platePieces() - 5 * (state.exh | 0));
  const speedWhy = () => ["30 base", platePieces() ? `−${5 * platePieces()} plate` : "", state.exh ? `−${5 * state.exh} exhaustion` : ""].filter(Boolean).join(", ");
  const hitNet = s => hitMod(s) - d20Pen();

  // Holy symbol makes each prayer 1 cheaper; a priest then pays half on themself, 75% on an ally (rounded up)
  function prayerCost(p, ally) {
    const b = Math.max(0, p.pp - ppLess());
    if (!isCls("priest")) return b;
    return Math.ceil(b * (ally ? 0.75 : 0.5));
  }
  function drainPerTurn() {
    let sum = 0;
    for (const n of state.prayersOn) if (PRAYER_BY[n]) sum += prayerCost(PRAYER_BY[n], false);
    for (const a of state.allyPrayers) if (PRAYER_BY[a.n]) sum += prayerCost(PRAYER_BY[a.n], true);
    return sum;
  }

  function itemInfo(it) {
    const key = String(it.name).trim().toLowerCase();
    const w = WEAPON_MAP[key];
    if (w) return { kind: "weapon", weapon: w, desc: `${w.dmg} · ${SPECIALS[w.type].n}${runesOf(w).length ? " · unlimited " + runeList(runesOf(w)) + " runes" : ""}` };
    const info = Object.assign({ kind: "other" }, ITEM_CAT[key] || {});
    if (info.kind === "other" && !ITEM_CAT[key] && it.heal !== undefined && it.heal !== null) { info.kind = "food"; info.heal = it.heal; }
    return info;
  }
  // Like OSRS: one slot per item, stackables (runes, arrows, coins) one slot per type. Potions: one per 2 doses
  function slotsUsed() {
    let n = RUNES.filter(([k]) => (state.runes[k] | 0) > 0).length + (state.gp > 0 ? 1 : 0);
    for (const it of state.items) {
      const q = it.qty | 0, info = itemInfo(it);
      if (q <= 0) continue;
      n += info.stack ? 1 : info.kind === "potion" ? Math.ceil(q / 2) : q;
    }
    return n;
  }
  const arrowItems = () => state.items.filter(it => itemInfo(it).ammo && (it.qty | 0) > 0);
  const currentArrows = () => { const l = arrowItems(); return l.find(it => it.name === ui.ammo) || l[0] || null; };

  function spellCheck(sp) {
    const magic = eff("magic");
    const short = [];
    for (const [r, q] of Object.entries(sp.r)) {
      if (isFree(r)) continue;
      if ((state.runes[r] | 0) < q) short.push(r);
    }
    return { levelOk: magic >= sp.l, short, ok: magic >= sp.l && short.length === 0 };
  }

  function rollDice(expr) {
    const m = /^(\d+)d(\d+)([+-]\d+)?$/i.exec(String(expr).replace(/\s/g, ""));
    if (!m) return null;
    const n = +m[1], s = +m[2], flat = m[3] ? parseInt(m[3], 10) : 0, rolls = [];
    for (let i = 0; i < n; i++) rolls.push(d(s));
    return { rolls, flat, total: rolls.reduce((a, b) => a + b, 0) + flat };
  }

  // Initiative: Agility affects it (+1 per 10 points, like every life skill), and Woodsman adds 3
  const agilityBonus = () => { const s = state.skills.find(k => /^agility$/i.test(String(k.name).trim())); return s ? Math.floor((s.pts | 0) / 10) : 0; };
  const initBonus = () => agilityBonus() + (isCls("ranger") ? 3 : 0);

  // Situational toggles that change attack rolls
  function attackOpts(style) {
    const hitBonus = [], extra = [];
    let adv = !!ui.adv;
    if (isCls("ranger") && ui.far && style === "ranged") hitBonus.push({ label: "Precision", v: 5 });
    if (state.innAdv) adv = true;
    if (isCls("ranger") && ui.beast) adv = true;
    const tgt = targetEnemy();
    if (isCls("warrior") && (ui.bloodied || (tgt && tgt.bloodied)) && style === "melee") extra.push({ label: "Bandos", dice: "1d6" });
    return { hitBonus, extra, adv };
  }

  function rollAttack(o) {
    const hm = hitMod(o.style), dm = dmgMod(o.style) + (o.dmgBonus || 0), pen = d20Pen();
    const hb = (o.hitBonus || []).reduce((a, b) => a + b.v, 0);
    const a = d(20), b = o.adv ? d(20) : null;
    const nat = o.adv ? Math.max(a, b) : a;
    const hit = nat + hm + hb - pen;
    const r = rollDice(o.dice);
    let dmg = r.total + dm;
    const parts = [`${r.rolls.join("+")}${r.flat ? fmt(r.flat) : ""}`];
    for (const x of o.extra || []) { const e = rollDice(x.dice); dmg += e.total; parts.push(`${e.total} ${x.label}`); }
    const natNote = nat === 20 ? " (nat 20!)" : nat === 1 ? " (nat 1)" : "";
    const hitTxt = `to hit ${hit}${natNote} [d20 ${o.adv ? `adv ${a}/${b}` : a}${fmt(hm)}${hb ? " " + fmt(hb) : ""}${pen ? ` −${pen} exh` : ""}]`;
    const dmgTxt = `damage ${dmg} [${parts.join(" + ")}${dm ? " " + fmt(dm) : ""}]`;
    return { hit, dmg, nat, text: `${hitTxt}, ${dmgTxt}` };
  }

  /* ================= Toast ================= */
  let toastT = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove("show"), 2800);
  }

  /* ================= Rendering ================= */
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function btn(act, arg, label, cls, disabled, extra) {
    const id = "b-" + act + (arg !== undefined && arg !== null ? "-" + String(arg).replace(/[^a-z0-9]/gi, "") : "");
    return `<button type="button" id="${id}" class="btn ${cls || ""}" data-act="${act}"${arg !== undefined && arg !== null ? ` data-arg="${esc(arg)}"` : ""}${disabled ? " disabled" : ""}${extra || ""}>${label}</button>`;
  }
  const chip = (key, label) => `<label class="chip" for="u-${key}"><input type="checkbox" id="u-${key}" data-ui="${key}"${ui[key] ? " checked" : ""}>${label}</label>`;
  const runeDot = r => `<i class="rd" style="--r:var(--rune-${r})" aria-hidden="true"></i>`;
  const hasBedroll = () => state.items.some(it => /bedroll/i.test(it.name) && (it.qty | 0) > 0);

  function renderChooser() {
    const cards = CLASS_ORDER.map(k => {
      const c = CLASSES[k];
      const st = STATS.map(([s, n]) => `<span>${n}<span class="num">${c.stats[s]}</span></span>`).join("");
      const defMod = Math.floor(c.stats.defense / 10);
      const ac = ["melee", "ranged", "magic"].map(s => c.worn.reduce((a, n) => a + ((armourInfo(n) || {})[s] | 0), 0) + defMod);
      const w = weaponInfo(c.weapon), sp = SPECIALS[w.type];
      return `<article class="pick">
        <h2>${c.name}</h2>
        <p class="muted">${c.blurb}</p>
        <div class="cls-stats">${st}</div>
        <p class="small"><b>AC</b> <span class="num">${ac.join(" / ")}</span> <span class="muted">melee / ranged / magic</span></p>
        <p class="small"><b>${esc(w.n)}</b> <span class="num">${w.dmg}</span> · ${sp.n} (${sp.cost}%): ${sp.desc}</p>
        ${ABILITIES[k].map(([a, t]) => `<p class="small"><b>${a}:</b> ${t}</p>`).join("")}
        ${btn("choose", k, `Play as ${c.name}`, "primary", connecting)}
      </article>`;
    }).join("");
    return `<header class="bar"><div class="bar-inner">
        <div class="who"><h1 style="font-size:1.5rem">Choose your class</h1></div>
        <div class="actions">${history.length ? btn("undo", null, "Back to my character") : ""}${STANDALONE ? btn("backup-load", null, "Load backup") : ""}${btn("rules", null, "Rulebook")}</div>
        <span class="status" id="status" data-s="${status.s}">${esc(status.text)}</span>
      </div></header>
      <main class="wrap">
        <div class="pick-intro">
          <label class="label" for="u-newName">Character name</label>
          <input id="u-newName" type="text" data-ui="newName" value="${esc(ui.newName)}" placeholder="Your name">
          <p class="muted small">Everyone plays a human for now. ${STANDALONE ? "Your sheet saves in this browser, and Download backup (under Notes) keeps a copy." : "Your sheet saves to your own account, so every player gets their own."}</p>
          ${connecting ? `<p class="small">Looking for a character you've already saved…</p>` : ""}
        </div>
        ${renderTogether()}
        <div class="picks">${cards}</div>
      </main>`;
  }

  function renderRest() {
    const bed = hasBedroll();
    return `<div class="rest-panel" role="group" aria-label="Long rest options">
      <div class="rest-opt">
        <b>Bedroll</b>
        <p>Fully restores everything: HP, prayer, special, exhaustion.</p>
        <div class="row">${btn("rest-bedroll", null, "Rest with bedroll", bed ? "primary tiny" : "tiny", !bed)}${bed ? "" : `<span class="small" style="color:var(--bad)">No bedroll in your pack</span>`}</div>
      </div>
      <div class="rest-opt">
        <b>Inn</b>
        <p>Fully restores everything, plus 10 temporary HP and advantage on hit rolls for the first round of your next fight. Once a day.</p>
        <div class="row">${btn("rest-inn", null, "Rest at inn", "primary tiny")}</div>
      </div>
      <div class="rest-opt">
        <b>Rough</b>
        <p>No bedroll or inn. Prayer and special refill and exhaustion clears, but no healing.</p>
        <div class="row">${btn("rest-rough", null, "Rest anyway", "tiny")}</div>
      </div>
    </div>`;
  }

  function renderBar() {
    return `
    <header class="bar"><div class="bar-inner">
      <div class="who">
        <input id="f-name" type="text" data-field="name" value="${esc(state.name)}" placeholder="Your name" aria-label="Character name">
        <span class="tag">Human ${cdef().name} · <span class="num" title="${speedWhy()}">${speed()}</span> ft speed${speed() < 30 ? ` <span class="small">(${speedWhy()})</span>` : ""}</span>
      </div>
      <div class="turn">
        <span class="label">Turn</span><span class="turn-count">${state.turn}</span>
        ${btn("end-turn", null, "End turn", "primary", inRoom() && !myTurn())}
        ${!inRoom() ? "" : myTurn() ? `<span class="otag you">Your turn</span>`
          : `<span class="small muted">${turnOrder().length ? `${esc(entryName(currentEntry()))}'s turn` : "No turn order yet"}</span>`}
      </div>
      <div class="actions">
        ${btn("undo", null, "Undo", "", history.length === 0)}
        ${btn("short-rest", null, "Short rest")}
        ${btn("rest-menu", null, ui.restOpen ? "Close rest" : "Long rest", ui.restOpen ? "primary" : "", false, ` aria-expanded="${ui.restOpen}"`)}
        ${btn("refill-pp", null, "Pray at altar")}
        ${btn("rules", null, "Rulebook")}
        ${net.api ? btn("session", null, inRoom() ? `Room ${esc(net.code)}` : "Play together", inRoom() ? "primary" : "", false, ` aria-expanded="${ui.sessOpen}"`) : ""}
      </div>
      <span class="status" id="status" data-s="${status.s}">${esc(status.text)}</span>
      ${ui.restOpen ? renderRest() : ""}
      ${ui.sessOpen ? renderSessionPanel() : ""}
    </div></header>`;
  }

  function orb(key, title, color, cur, max, ctrlHtml, note) {
    const pct = max > 0 ? clamp(cur / max, 0, 1) : 0;
    return `
    <div class="orb" style="--c:var(--${color})">
      <div class="ring" style="--pct:${pct.toFixed(3)}">
        <div class="ring-in">
          <input id="f-${key}" type="number" data-field="${key}" value="${cur}" aria-label="${title} current">
          <span class="of">/ ${max}</span>
        </div>
      </div>
      <h3>${title}</h3>
      <div class="orb-ctrl">${ctrlHtml}</div>
      ${note ? `<div class="orb-note">${note}</div>` : ""}
    </div>`;
  }

  function renderVitals() {
    const hpCtrl = `<input id="u-hpAmt" type="number" min="0" data-ui="hpAmt" value="${ui.hpAmt}" aria-label="HP amount">
      ${btn("hp-dmg", null, "Damage", "tiny")}${btn("hp-heal", null, "Heal", "tiny")}`;
    const ppCtrl = `<input id="u-ppAmt" type="number" min="0" data-ui="ppAmt" value="${ui.ppAmt}" aria-label="Prayer amount">
      ${btn("pp-spend", null, "Spend", "tiny")}${btn("pp-add", null, "Restore", "tiny")}`;
    const specCtrl = `${btn("spec-step", -10, "−10%", "tiny")}${btn("spec-step", 10, "+10%", "tiny")}${btn("spec-step", 100, "Full", "tiny")}`;
    const drain = drainPerTurn();
    let pips = "";
    for (let i = 0; i <= 6; i++) pips += `<button type="button" id="b-exh-${i}" class="pip${i <= state.exh && i > 0 ? " on" : ""}" data-act="exh" data-arg="${i}" aria-label="Exhaustion ${i}" aria-pressed="${i === state.exh}">${i}</button>`;
    const exhNote = state.exh >= 6
      ? `<span class="dead">Level 6: you die.</span> Long rest clears exhaustion.`
      : (state.exh ? `<strong style="color:var(--exh)">−${d20Pen()} to all d20 rolls, −${5 * state.exh} ft speed.</strong> ` : "Each level: −2 to d20 rolls, −5 ft speed. ")
        + `Level 6 is death.${isCls("wizard") ? " Surging Power adds 2." : ""} Long rest clears it.`;
    return `<section class="vitals" aria-label="Vitals">
      ${orb("hp", "Hitpoints", "hp", state.hp, hpMax(), hpCtrl, state.hp > hpMax() ? `<strong style="color:var(--good)">${state.hp - hpMax()} temporary HP</strong>` : state.hp <= hpMax() / 2 && hpMax() > 0 ? "Bloodied (half HP or less)" : "")}
      ${orb("pp", "Prayer", "pray", state.pp, ppMax(), ppCtrl, drain ? `Draining <span class="drain">${drain}</span> per turn` : "No prayers active")}
      ${orb("spec", "Special", "spec", state.spec, 100, specCtrl, "Regains 10% at end of turn. Full on short or long rest.")}
      <div class="orb" style="--c:var(--exh)">
        <div class="ring" style="--pct:${(state.exh / 6).toFixed(3)}">
          <div class="ring-in"><span class="num" style="font-size:1.9rem">${state.exh}</span><span class="of">/ 6</span></div>
        </div>
        <h3>Exhaustion</h3>
        <div class="pips" role="group" aria-label="Set exhaustion">${pips}</div>
        <div class="orb-note">${exhNote}</div>
      </div>
    </section>`;
  }

  function renderCombat() {
    const cards = Object.entries(STYLE).map(([s, st]) => {
      const prayAc = prayerBits("ac", s).map(x => `<span class="pray-bit">${fmt(x.b.v)} ${esc(x.n)}</span>`).join("");
      const prayDmg = prayerSum("dmg", s);
      const gearBits = fxSum("hit", s) || fxSum("dmg", s);
      const src = STYLE[s].hit === STYLE[s].dmg ? STAT_NAME[STYLE[s].hit] : STAT_NAME[STYLE[s].hit] + " / " + STAT_NAME[STYLE[s].dmg];
      return `<div class="style-card">
        <div class="label">${st.name}</div>
        <div class="shield" aria-label="${st.name} armour class ${acTotal(s)}"><span class="num">${acTotal(s)}</span></div>
        <div class="ac-break">
          <span>${armourSum(s)} armour</span>
          <span>${fmt(mod("defense"))} Defense</span>${prayAc}
        </div>
        <div class="mods">
          <span>To hit<b>${fmt(hitNet(s))}</b></span>
          <span>Damage<b>${fmt(dmgMod(s))}</b></span>
          <span class="src-note">${src}${gearBits ? " + amulet" : ""}${prayDmg ? " + prayer" : ""}${d20Pen() ? `, −${d20Pen()} exhaustion` : ""}</span>
        </div>
      </div>`;
    }).join("");
    const spd = speed();
    const speedCard = `<div class="style-card">
        <div class="label">Speed</div>
        <div class="shield speed${spd < 30 ? " slow" : ""}" aria-label="Speed ${spd} feet"><span class="num">${spd}</span></div>
        <div class="ac-break"><span>feet per turn</span></div>
        <div class="mods"><span class="src-note">${esc(speedWhy())}</span></div>
      </div>`;
    return `<section class="combat" aria-label="Armour class, modifiers and speed">${cards}${speedCard}</section>`;
  }

  function renderWeapon() {
    const w = wielded();
    const style = styleOf(w);
    const sp = w ? SPECIALS[w.type] : null;
    const bow = needsArrows(w);
    const arrows = currentArrows();
    const packWeapons = state.items.filter(it => itemInfo(it).kind === "weapon" && (it.qty | 0) > 0 && (!w || it.name.toLowerCase() !== w.n.toLowerCase()));
    const opts = (w ? `<option value="${esc(w.n)}" selected>${esc(w.n)}</option>` : "")
      + packWeapons.map(it => `<option value="${esc(it.name)}">${esc(it.name)}</option>`).join("")
      + `<option value=""${w ? "" : " selected"}>Nothing</option>`;
    const o = attackOpts(style);
    const arrowDmg = bow && arrows ? itemInfo(arrows).ammo.dmg : 0;
    const dmgTxt = w ? `${w.dmg}${fmt(dmgMod(style) + arrowDmg)}${o.extra.map(x => " +" + x.dice).join("")}` : "—";
    const hitTxt = fmt(hitNet(style) + o.hitBonus.reduce((a, b) => a + b.v, 0));
    const toggles = [chip("adv", "Advantage")];
    if (state.innAdv) toggles.push(btn("inn-adv-done", null, "Inn rest: advantage this round · Done", "tiny primary"));
    if (isCls("warrior")) toggles.push(chip("bloodied", "Target is bloodied"));
    if (isCls("ranger")) toggles.push(chip("far", "Target 15+ ft away"), chip("beast", "Target is a beast"));
    const hits = (sp && sp.hits) || 1;
    const canAttack = !!w && (!bow || !!arrows);
    const canSpec = !!sp && state.spec >= (sp.cost || 0) && (!bow || (!!arrows && arrows.qty >= hits));
    const arrowOpts = arrowItems().map(it => `<option value="${esc(it.name)}"${arrows && it.name === arrows.name ? " selected" : ""}>${esc(it.name)} (${it.qty})</option>`).join("");
    return `<section class="panel" aria-labelledby="h-weapon">
      <div class="panel-head"><h2 id="h-weapon">Weapon</h2><span class="sub">Swapping weapons is a bonus action</span></div>
      <div class="weapon">
        <div class="weapon-top">
          <div>
            <div class="label">Wielding</div>
            <select id="f-weapon" data-field="weapon" class="btn" aria-label="Wielded weapon">${opts}</select>
          </div>
          <div style="text-align:right">
            <div class="label">${STYLE[style].name} · to hit ${hitTxt}</div>
            <span class="num" style="font-size:1.25rem">${dmgTxt}</span>
          </div>
        </div>
        ${w && w.note ? `<div class="small muted">${esc(w.note)}</div>` : ""}
        ${runesOf(w).length ? `<div class="small muted">Unlimited ${runeList(runesOf(w))} runes while wielded.</div>` : ""}
        ${bow ? `<div class="wear-row"><span class="label">Arrows</span>${arrowOpts ? `<select id="u-ammo" data-ui="ammo" class="btn tiny" aria-label="Arrows">${arrowOpts}</select>` : `<span class="small" style="color:var(--bad)">No arrows. Buy some at Lowe's Archery Emporium.</span>`}</div>` : ""}
        ${inRoom() && Object.keys(net.enemies).length ? `<div class="wear-row"><span class="label">Target</span><select id="u-target" data-ui="target" class="btn tiny" aria-label="Target"><option value="">No target</option>${Object.entries(net.enemies).filter(([, en]) => !en.down).map(([id, en]) => `<option value="${esc(id)}"${ui.target === id ? " selected" : ""}>${esc(en.name)}${en.bloodied ? " (bloodied)" : ""}</option>`).join("")}</select>${isCls("warrior") && targetEnemy() && targetEnemy().bloodied ? `<span class="small">Bloodied, so Blood for Bandos applies</span>` : ""}</div>` : ""}
        <div class="toggles" role="group" aria-label="Situation">${toggles.join("")}</div>
        <div class="actions">
          ${btn("attack", null, "Attack", canAttack ? "primary" : "", !canAttack)}
          ${sp ? btn("special", null, `${sp.n} (${sp.cost != null ? sp.cost + "%" : "no cost listed"})`, "", !canSpec) : ""}
        </div>
        ${sp ? `<p class="small muted" style="margin:0"><b>${sp.n}:</b> ${sp.desc}. ${sp.kind === "attack" ? "Takes your action." : "Bonus action."}</p>` : ""}
        <p class="small muted" style="margin:0">${isCls("ranger") ? "Advantage and Target is a beast also apply to spells. Precision is for ranged weapons only." : "Advantage also applies to spells."}</p>
      </div>
    </section>`;
  }

  function renderAbilities() {
    const k = state.cls, rows = [];
    const row = (name, text, button) => `<div class="ability"><b>${name}</b><p>${text}</p>${button || ""}</div>`;
    if (k === "wizard") {
      rows.push(row("Gaze of Zaros", "Heal 5 HP when anyone in your line of sight fails a magic saving throw.", btn("gaze", null, "+5 HP", "tiny", state.hp >= hpMax())));
      rows.push(row("Surging Power", "Cast three spells in one turn. You gain 2 levels of exhaustion.", btn("surge", null, "Use", "tiny", state.exh >= 6)));
    }
    if (k === "warrior") {
      rows.push(row("Blood for Bandos", "+1d6 melee damage against a bloodied enemy (half HP or less, or whenever the DM says so). Tick \"Target is bloodied\" on your weapon and it's added to your rolls."));
      rows.push(row("Drums of War", "Your allies get advantage on attack and damage rolls for 2 turns. Once a day; a long rest resets it.", btn("drums", null, state.daily.drums ? "Used today" : "Use", "tiny", !!state.daily.drums)));
    }
    if (k === "ranger") {
      rows.push(row("Armadyl's Precision", "+5 to hit with ranged weapon attacks when the enemy is at least 15 ft away (not spells). Tick \"Target 15+ ft away\" to add it. Recovering arrows after a fight is up to the DM."));
      rows.push(row("Woodsman", "Advantage against beasts (tick \"Target is a beast\") and on Hunting checks, and +3 to initiative."));
    }
    if (k === "priest") {
      rows.push(row("Saradomin's Favoured", "Your prayers cost half (rounded up). The costs on your prayer list already include it."));
      rows.push(row("Selfless", "Pray for allies at 75% of the cost. Only priests can buff others. Add them under Prayers."));
    }
    if (wearing("Holy book")) {
      rows.push(row("Holy book", "Fully restore your prayer points once a day.", btn("holybook", null, state.daily.holybook ? "Used today" : "Restore prayer", "tiny", !!state.daily.holybook)));
    }
    return `<section class="panel" aria-labelledby="h-abil">
      <div class="panel-head"><h2 id="h-abil">${cdef().name} abilities</h2>${btn("initiative", null, `Roll initiative (${fmt(initBonus())})`, "tiny")}</div>
      <div class="weapon">${rows.join("")}</div>
    </section>`;
  }

  function renderSpells() {
    const base = state.stats.magic.base | 0;
    const rows = SPELLS.map((sp, i) => {
      const c = spellCheck(sp);
      if (ui.filter === "castable" && !c.ok) return "";
      const costs = Object.entries(sp.r).map(([r, q]) => {
        if (isFree(r)) return `<span class="rc free" title="Covered by your staff">${runeDot(r)}${q} ${RUNE_NAME[r]} · staff</span>`;
        const isShort = c.short.includes(r);
        return `<span class="rc${isShort ? " short" : ""}" title="${isShort ? "You have " + (state.runes[r] | 0) : ""}">${runeDot(r)}${q} ${RUNE_NAME[r]}</span>`;
      }).join("");
      let why = "";
      if (!c.levelOk) why = `Needs Magic ${sp.l}`;
      else if (c.short.length) why = "Missing " + c.short.map(r => RUNE_NAME[r].toLowerCase()).join(", ");
      const boosted = c.levelOk && sp.l > base;
      return `<div class="spell${c.levelOk ? "" : " locked"}">
        <span class="lvl">${sp.l}</span>
        <div class="spell-name">${esc(sp.n)}${sp.d ? `<span class="dmg">${sp.d}${fmt(dmgMod("magic") + staffSpellBonus(sp))}</span>` : ""}<span class="kind">${KIND[sp.k]}</span>${boosted ? `<span class="badge-boost">Boosted</span>` : ""}</div>
        <div class="spell-cast">${btn("cast", i, "Cast", c.ok ? "primary tiny" : "tiny", !c.ok)}${why ? `<span class="why">${why}</span>` : ""}</div>
        <div class="spell-fx">${esc(sp.fx)}</div>
        <div class="costs">${costs}</div>
      </div>`;
    }).join("");
    const castable = SPELLS.filter(sp => spellCheck(sp).ok).length;
    return `<section class="panel" aria-labelledby="h-spells">
      <div class="panel-head">
        <div><h2 id="h-spells">Spellbook</h2><div class="sub">Magic ${eff("magic")} · to hit ${fmt(hitNet("magic"))}${d20Pen() ? ` (incl. −${d20Pen()} exhaustion)` : ""}, damage ${fmt(dmgMod("magic"))} · ${castable} of ${SPELLS.length} castable now</div></div>
        <div class="seg" role="group" aria-label="Filter spells">
          <button type="button" id="b-filter-all" data-act="filter" data-arg="all" aria-pressed="${ui.filter === "all"}">All</button>
          <button type="button" id="b-filter-castable" data-act="filter" data-arg="castable" aria-pressed="${ui.filter === "castable"}">Castable</button>
        </div>
      </div>
      <div class="spells">${rows || `<p class="empty">Nothing castable right now. Check your runes${isCls("wizard") ? " and staff" : ""}.</p>`}</div>
      <p class="small muted" style="margin:0">Damage spells take your action and roll to hit and damage. Every non-damaging spell is a bonus action.</p>
    </section>`;
  }

  function renderPrayers() {
    const lvl = eff("prayer");
    const priest = isCls("priest");
    const items = PRAYERS.map((p, i) => {
      const on = state.prayersOn.includes(p.n);
      const locked = lvl < p.l;
      return `<button type="button" id="b-pray-${i}" class="pr" data-act="pray" data-arg="${i}" aria-pressed="${on}"${locked && !on ? " disabled" : ""}>
        <span class="pr-dot" aria-hidden="true"></span>
        <span class="pr-name"><span>${esc(p.n)}</span><span class="num">${locked ? "Lvl " + p.l : prayerCost(p, false) + " pp"}</span></span>
        <span class="pr-fx">${esc(p.fx)}</span>
      </button>`;
    }).join("");
    let ally = "";
    if (priest) {
      const list = state.allyPrayers.map((a, i) => `<div class="effect">
          <b>${esc(a.n)}</b><span>on ${esc(a.who || "an ally")}</span>
          <span class="turns">${PRAYER_BY[a.n] ? prayerCost(PRAYER_BY[a.n], true) : 0} pp/turn</span>
          ${btn("ally-remove", i, "×", "icon tiny danger", false, ` aria-label="Stop ${esc(a.n)} on ${esc(a.who || "ally")}"`)}
        </div>`).join("");
      const opts = PRAYERS.filter(p => lvl >= p.l).map(p => `<option value="${esc(p.n)}"${ui.allyPick === p.n ? " selected" : ""}>${esc(p.n)} (${prayerCost(p, true)} pp)</option>`).join("");
      ally = `<div class="label">Prayers on allies</div>
        <div class="ally-list">${list || `<p class="empty">None. Their effects go on the ally's own sheet; the cost comes off your prayer points.</p>`}</div>
        <div class="custom-armour">
          <select id="u-allyPick" data-ui="allyPick" class="btn tiny" aria-label="Prayer for an ally"><option value="">Choose a prayer…</option>${opts}</select>
          ${inRoom()
            ? `<select id="u-allyTo" data-ui="allyTo" class="btn tiny" aria-label="Ally"><option value="">Choose an ally…</option>${Object.entries(net.players).filter(([id]) => id !== net.uid).map(([id, pl]) => `<option value="${esc(id)}"${ui.allyTo === id ? " selected" : ""}>${esc(pl.name || "Player")}</option>`).join("")}</select>`
            : `<input id="u-allyWho" type="text" data-ui="allyWho" value="${esc(ui.allyWho)}" placeholder="Ally's name" aria-label="Ally's name">`}
          ${btn("ally-add", null, "Pray for ally", "tiny")}
        </div>`;
    }
    const drain = drainPerTurn();
    const less = ppLess();
    return `<section class="panel" aria-labelledby="h-prayers">
      <div class="panel-head">
        <div><h2 id="h-prayers">Prayers</h2><div class="sub">Prayer ${lvl} · turning on up to 3 is one bonus action, turning off is free${less ? ` · Holy symbol: −${less} per prayer` : ""}${priest ? " · costs halved (Saradomin's Favoured)" : ""}</div></div>
        <div class="small">Drain <span class="drain">${drain}</span>/turn ${state.prayersOn.length || state.allyPrayers.length ? btn("pray-off", null, "All off", "tiny") : ""}</div>
      </div>
      <div class="prayers">${items}</div>
      ${ally}
      ${buffPrayers().length ? `<div class="label">From allies</div><div class="ally-list">${buffPrayers().map(x => `<div class="effect"><b>${esc(x.n)}</b><span>from ${esc(x.from)}</span><span class="turns">${esc((PRAYER_BY[x.n] || {}).fx || "")}</span></div>`).join("")}</div>` : ""}
    </section>`;
  }

  function renderArmour() {
    const rows = state.worn.map((w, i) => {
      const a = armourInfo(w.n);
      const ac = w.melee || w.ranged || w.magic;
      return `<div class="item">
        <span class="worn-name">${esc(w.n)}</span>
        <div class="item-ctrl">
          ${ac ? `<span class="triple" title="Melee / ranged / magic AC">${w.melee} / ${w.ranged} / ${w.magic}</span>` : ""}
          ${btn("unwear", i, "Take off", "tiny")}
        </div>
        ${a && a.note ? `<div class="item-sub">${esc(a.note)}</div>` : ""}
      </div>`;
    }).join("");
    const mine = cdef().name;
    const groups = [mine, "General"].concat(["Warrior", "Ranger", "Wizard", "Priest"].filter(c => c !== mine)).map(c => `<optgroup label="${c}">${ARMOUR.filter(a => a.c === c && !state.worn.some(w => w.n === a.n))
      .map(a => `<option value="${esc(a.n)}"${ui.wearPick === a.n ? " selected" : ""}>${esc(a.n)}${a.melee || a.ranged || a.magic ? ` (${a.melee}/${a.ranged}/${a.magic})` : ""}</option>`).join("")}</optgroup>`).join("");
    return `<section class="panel" aria-labelledby="h-armour">
      <div class="panel-head"><h2 id="h-armour">Armour</h2><span class="sub">From gear: <span class="num">${armourSum("melee")} / ${armourSum("ranged")} / ${armourSum("magic")}</span> melee / ranged / magic</span></div>
      <div class="items">${rows || `<p class="empty">You're not wearing anything.</p>`}</div>
      <div class="wear-row">
        <select id="u-wearPick" data-ui="wearPick" class="btn tiny" aria-label="Armour to wear"><option value="">Choose armour to wear…</option>${groups}</select>
        ${btn("wear", null, "Wear", "tiny")}
      </div>
      <div class="custom-armour">
        <input id="u-caName" type="text" data-ui="caName" value="${esc(ui.caName)}" placeholder="Other armour" aria-label="Custom armour name">
        <input id="u-caM" type="number" data-ui="caM" value="${ui.caM}" aria-label="Melee AC" title="Melee AC">
        <input id="u-caR" type="number" data-ui="caR" value="${ui.caR}" aria-label="Ranged AC" title="Ranged AC">
        <input id="u-caG" type="number" data-ui="caG" value="${ui.caG}" aria-label="Magic AC" title="Magic AC">
        ${btn("wear-custom", null, "Wear", "tiny")}
      </div>
      <p class="small muted" style="margin:0">${esc(cdef().prof)}. Swapping one piece is a bonus action, two is a bonus action and an action.</p>
    </section>`;
  }

  function renderRunes() {
    const cells = RUNES.map(([k, n]) => {
      const inf = isFree(k);
      return `<div class="rune${inf ? " inf" : ""}">
        ${runeDot(k)}<span class="rune-name">${n}${inf ? " <span class='muted small'>∞</span>" : ""}</span>
        ${btn("rune", k + "-dec", "−", "icon tiny", (state.runes[k] | 0) <= 0, ` aria-label="Remove one ${n} rune"`)}
        <input id="f-rune-${k}" type="number" min="0" data-field="rune:${k}" value="${state.runes[k] | 0}" aria-label="${n} runes">
        ${btn("rune", k + "-inc", "+", "icon tiny", false, ` aria-label="Add one ${n} rune"`)}
      </div>`;
    }).join("");
    return `<section class="panel" aria-labelledby="h-runes">
      <div class="panel-head"><h2 id="h-runes">Rune pouch</h2><span class="sub">Each rune type takes 1 inventory slot</span></div>
      <div class="runes">${cells}</div>
    </section>`;
  }

  function renderStats() {
    const rows = STATS.map(([k, n]) => {
      const s = state.stats[k], e = eff(k), g = gearLvl(k), x = effSum(k);
      const cls = g + x > 0 ? " up" : g + x < 0 ? " down" : "";
      return `<tr>
        <td>${n}</td>
        <td><input id="f-sb-${k}" type="number" data-field="stat-base:${k}" value="${s.base}" aria-label="${n} base"></td>
        <td class="mod">${g ? fmt(g) : "·"}</td>
        <td class="mod">${x ? fmt(x) : "·"}</td>
        <td class="eff${cls}">${e}</td>
        <td class="mod">${k === "hitpoints" || k === "prayer" ? "" : fmt(mod(k))}</td>
      </tr>`;
    }).join("");
    const effs = state.effects.map((e, i) => `<div class="effect">
        <b>${esc(e.label)}</b><span>${STAT_NAME[e.stat] || esc(e.stat)} <span class="amt ${e.amt >= 0 ? "up" : "down"}">${fmt(e.amt | 0)}</span></span>
        <span class="turns">${e.turns > 0 ? `${e.turns} turn${e.turns === 1 ? "" : "s"} left` : "until removed"}</span>
        ${btn("effect-remove", i, "×", "icon tiny danger", false, ` aria-label="End ${esc(e.label)}"`)}
      </div>`).join("");
    const statOpts = STATS.map(([k, n]) => `<option value="${k}"${ui.effStat === k ? " selected" : ""}>${n}</option>`).join("");
    return `<section class="panel" aria-labelledby="h-stats">
      <div class="panel-head"><h2 id="h-stats">Stats</h2><span class="sub">Mod = +1 per 10 levels</span></div>
      <div class="table-wrap"><table class="stats">
        <thead><tr><th>Skill</th><th>Base</th><th style="text-align:right">Gear</th><th style="text-align:right">Effects</th><th style="text-align:right">Now</th><th style="text-align:right">Mod</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="label">Active effects</div>
      <div class="effects">${effs || `<p class="empty">No boosts or drains. Specials, potions and brews show here and count down each turn.</p>`}</div>
      <div class="custom-armour">
        <select id="u-effStat" data-ui="effStat" class="btn tiny" aria-label="Effect stat">${statOpts}</select>
        <input id="u-effAmt" type="number" data-ui="effAmt" value="${ui.effAmt}" aria-label="Effect amount">
        for <input id="u-effTurns" type="number" min="0" data-ui="effTurns" value="${ui.effTurns}" aria-label="Effect turns"> turns
        ${btn("effect-add", null, "Add effect", "tiny")}
      </div>
    </section>`;
  }

  function renderItems() {
    const av = avarice();
    const rows = state.items.map((it, i) => {
      const info = itemInfo(it);
      const food = info.kind === "food", pot = info.kind === "potion", weap = info.kind === "weapon";
      const known = !!ITEM_CAT[String(it.name).trim().toLowerCase()] || weap;
      const canEat = food && it.qty > 0 && state.ate < 2;
      let sub;
      if (food && !known) sub = `Heals <input id="f-ih-${i}" type="number" min="0" data-field="item-heal:${i}" value="${esc(it.heal)}" placeholder="?" aria-label="${esc(it.name)} heals"> HP`;
      else if (food) sub = `Heals ${info.heal} HP${av ? ` <span style="color:var(--bad)">(−${av} Avarice = ${Math.max(0, info.heal - av)})</span>` : ""}${info.desc ? " · " + esc(info.desc) : ""}`;
      else if (pot) sub = `<span class="num">${it.qty}</span> dose${it.qty === 1 ? "" : "s"} · ${esc(info.desc || "")}`;
      else sub = `${info.desc ? esc(info.desc) + " " : ""}${known ? "" : btn("item-food", i, "Make food", "tiny")}`;
      return `<div class="item">
        <input id="f-in-${i}" type="text" data-field="item-name:${i}" value="${esc(it.name)}" aria-label="Item name">
        <div class="item-ctrl">
