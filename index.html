          ${btn("item", i + "-dec", "−", "icon tiny", it.qty <= 0, ` aria-label="One fewer ${esc(it.name)}"`)}
          <input id="f-iq-${i}" type="number" min="0" data-field="item-qty:${i}" value="${it.qty}" aria-label="${esc(it.name)} ${pot ? "doses" : "quantity"}">
          ${btn("item", i + "-inc", "+", "icon tiny", false, ` aria-label="One more ${esc(it.name)}"`)}
          ${food ? btn("eat", i, "Eat", canEat ? "primary tiny" : "tiny", !canEat) : ""}
          ${pot ? btn("drink", i, "Drink", it.qty > 0 ? "primary tiny" : "tiny", it.qty <= 0) : ""}
          ${weap ? btn("wield", i, "Wield", "tiny", it.qty <= 0) : ""}
        </div>
        <div class="item-sub">${sub}<span style="margin-left:auto">${btn("item-remove", i, "Remove", "tiny danger")}</span></div>
      </div>`;
    }).join("");
    const slots = slotsUsed();
    const dl = ITEM_LIST.map(i => i.n).concat(WEAPONS.map(w => w.n)).map(n => `<option value="${esc(n)}"></option>`).join("");
    return `<section class="panel" aria-labelledby="h-items">
      <div class="panel-head"><h2 id="h-items">Pack</h2><span class="sub"><span class="num" style="color:${slots > 28 ? "var(--bad)" : "var(--ink)"}">${slots}</span>/28 slots · eat up to 2 per turn (${state.ate}/2)</span></div>
      <div class="gp"><span class="label">Coins</span><input id="f-gp" type="number" min="0" data-field="gp" value="${state.gp}" aria-label="Gold pieces"><span class="num muted">gp</span></div>
      <div class="items">${rows || `<p class="empty">Your pack is empty.</p>`}</div>
      <div class="add-row">
        <input id="u-newItem" type="text" list="item-cat" data-ui="newItem" value="${esc(ui.newItem)}" placeholder="Add item, e.g. Magic potion" aria-label="New item name">
        <datalist id="item-cat">${dl}</datalist>
        ${btn("item-add", null, "Add", "tiny")}
      </div>
      <p class="small muted" style="margin:0">Like OSRS: one slot per item, and runes, arrows and coins take one slot per type. A potion is one slot per 2 doses. Worn gear and your wielded weapon don't count.</p>
    </section>`;
  }

  function renderShop() {
    const shop = SHOPS[clamp(ui.shop | 0, 0, SHOPS.length - 1)];
    const q = Math.max(1, ui.buyQty | 0);
    const opts = SHOPS.map((s, i) => `<option value="${i}"${(ui.shop | 0) === i ? " selected" : ""}>${esc(s.n)}</option>`).join("");
    const rows = shop.items.map((it, i) => {
      const cost = it.p * q;
      return `<div class="shop-row">
        <span>${it.rune ? runeDot(it.rune) + " " : ""}${esc(it.n)}${it.desc ? `<span class="small muted"> · ${esc(it.desc)}</span>` : ""}</span>
        <span class="price">${it.p}gp</span>
        ${btn("buy", i, q > 1 ? `Buy ${q} (${cost})` : "Buy", "tiny", state.gp < cost)}
      </div>`;
    }).join("");
    return `<section class="panel" aria-labelledby="h-shop">
      <div class="panel-head"><h2 id="h-shop">Shops</h2><span class="sub">You have <span class="num">${state.gp}</span>gp</span></div>
      <div class="wear-row">
        <select id="u-shop" data-ui="shop" class="btn tiny" aria-label="Shop">${opts}</select>
        <label class="small" for="u-buyQty">Qty</label>
        <input id="u-buyQty" type="number" min="1" data-ui="buyQty" value="${q}">
      </div>
      <div>${rows}</div>
      <p class="small muted" style="margin:0">Buying takes the coins and adds runes to your pouch or items to your pack.</p>
    </section>`;
  }

  function renderSkills() {
    const used = state.skills.reduce((a, s) => a + (s.pts | 0), 0);
    const left = 80 - used;
    const rows = state.skills.map((s, i) => {
      const dsc = SKILL_DESC[String(s.name).trim().toLowerCase()];
      return `<div class="item">
        <input id="f-kn-${i}" type="text" data-field="skill-name:${i}" value="${esc(s.name)}" aria-label="Skill name">
        <div class="item-ctrl">
          <span class="triple" title="Check and save bonus">${fmt(Math.floor((s.pts | 0) / 10))}</span>
          <input id="f-kp-${i}" type="number" min="0" max="30" data-field="skill-pts:${i}" value="${s.pts}" aria-label="${esc(s.name)} points">
          ${btn("skill-remove", i, "×", "icon tiny danger", false, ` aria-label="Remove ${esc(s.name)}"`)}
        </div>
        ${dsc ? `<div class="item-sub">${esc(dsc)}</div>` : ""}
      </div>`;
    }).join("");
    return `<section class="panel" aria-labelledby="h-skills">
      <div class="panel-head"><h2 id="h-skills">Life skills</h2><span class="sub"><span class="num" style="color:${left < 0 ? "var(--bad)" : "var(--ink)"}">${left}</span> of 80 points left · max 30 each · +1 per 10 points</span></div>
      <div class="items">${rows || `<p class="empty">No skills listed.</p>`}</div>
      <div class="add-row">
        <input id="u-newSkill" type="text" data-ui="newSkill" value="${esc(ui.newSkill)}" placeholder="Another skill" aria-label="New skill name">
        ${btn("skill-add", null, "Add", "tiny")}
      </div>
    </section>`;
  }

  function renderDice() {
    const lr = state.lastRoll;
    const dice = [4, 6, 8, 10, 12, 20, 100].map(s => btn("dice", s, "d" + s, "tiny")).join("");
    return `<section class="panel" aria-labelledby="h-dice">
      <div class="panel-head"><h2 id="h-dice">Dice</h2>
        <span class="sub dice">
          <input id="u-diceN" type="number" min="1" max="20" data-ui="diceN" value="${ui.diceN}" aria-label="Number of dice"> dice, mod
          <input id="u-diceMod" type="number" data-ui="diceMod" value="${ui.diceMod}" aria-label="Modifier">
        </span>
      </div>
      <div class="dice">${dice}</div>
      <div class="roll-out" aria-live="polite">${lr ? `${esc(lr.label)}: ${esc(lr.detail)}<b>${lr.total}</b>` : `<span class="muted small" style="font-family:var(--f-body)">Attack, spell and initiative rolls show here too.</span>`}</div>
    </section>`;
  }

  function renderSaves() {
    const statBtns = STATS.map(([k, n]) => btn("save", "s-" + k, `${n}<b>${fmt(mod(k))}</b>`, "tiny save-btn")).join("");
    const skillBtns = state.skills.map((s, i) => btn("save", "k-" + i, `${esc(s.name)}<b>${fmt(Math.floor((s.pts | 0) / 10))}</b>`, "tiny save-btn")).join("");
    return `<section class="panel" aria-labelledby="h-saves">
      <div class="panel-head"><h2 id="h-saves">Saves &amp; checks</h2><span class="sub">d20 + 1 per 10 levels${d20Pen() ? `, −${d20Pen()} exhaustion` : ""}</span></div>
      <div class="wear-row">
        <label class="small" for="u-dc">DC</label>
        <input id="u-dc" type="number" min="0" data-ui="dc" value="${ui.dc}" aria-label="Difficulty to beat">
        ${chip("saveAdv", "Advantage")}${chip("saveDis", "Disadvantage")}
      </div>
      <div class="label">Stats</div>
      <div class="save-grid">${statBtns}</div>
      <div class="label">Life skills</div>
      <div class="save-grid">${skillBtns || `<p class="empty">No life skills listed.</p>`}</div>
      <p class="small muted" style="margin:0">Saves work like the enemies' do: a STR 10 save is d20 + your Strength bonus against 10, an AGI save uses your Agility points. Set DC to 0 to just roll.</p>
    </section>`;
  }

  function renderDeath() {
    const ds = state.death || { s: 0, f: 0 };
    const dots = (on, cls) => [0, 1, 2].map(i => `<span class="ds ${cls}${i < on ? " on" : ""}" aria-hidden="true"></span>`).join("");
    const dead = ds.f >= 3, stable = ds.s >= 3;
    return `<section class="panel dying" aria-labelledby="h-dying">
      <div class="panel-head"><h2 id="h-dying">${dead ? "Dead" : stable ? "Stable at 0 HP" : "Down: make death saves"}</h2>
        <span class="sub">d20${d20Pen() ? ` −${d20Pen()} exhaustion` : ""}: 10 or more succeeds. A natural 1 is two failures, a natural 20 brings you back with 1 HP. Damage at 0 HP is a failure, two on a critical hit. Any healing ends it.</span></div>
      <div class="ds-row" aria-label="${ds.s} successes, ${ds.f} failures"><span class="label">Successes</span>${dots(ds.s, "ok")}<span class="label">Failures</span>${dots(ds.f, "bad")}</div>
      <div class="actions">
        ${btn("death-roll", null, "Roll death save", "primary", dead || stable)}
        ${btn("death-fail", 1, "Hit while down (+1 failure)", "", dead)}
        ${btn("death-fail", 2, "Critical hit (+2)", "", dead)}
        ${btn("death-reset", null, "Clear saves", "")}
      </div>
    </section>`;
  }

  function renderLog() {
    const items = state.log.slice(0, 40).map(e => `<li><span class="t">T${e.t}</span><span>${esc(e.m)}</span></li>`).join("");
    return `<section class="panel" aria-labelledby="h-log">
      <div class="panel-head"><h2 id="h-log">Turn log</h2><span class="sub">Useful for playtest feedback</span></div>
      <ul class="log">${items || `<li class="empty">Nothing yet.</li>`}</ul>
    </section>`;
  }

  function renderNotes() {
    return `<section class="panel" aria-labelledby="h-notes">
      <h2 id="h-notes">Notes</h2>
      <textarea id="f-notes" data-field="notes" aria-label="Notes">${esc(state.notes)}</textarea>
      ${STANDALONE ? `<p class="small muted" style="margin:0">This sheet saves in this browser only. Download a backup to keep it safe or move it to another device.</p>` : ""}
      <div class="foot">${STANDALONE ? btn("backup-save", null, "Download backup", "tiny") + btn("backup-load", null, "Load backup", "tiny") : ""}${btn("reset", null, ui.resetArm ? "Click again to start a new character" : "Start a new character", "tiny danger")}</div>
    </section>`;
  }

  const MAIN = { spells: renderSpells, prayers: renderPrayers };

  /* ---------- Live session views ---------- */
  function mbar(label, v, max, c) {
    const pct = max > 0 ? clamp(Math.round((100 * v) / max), 0, 100) : 0;
    return `<div class="mbar" style="--c:var(--${c})"><span class="mlabel">${label}</span><span class="mtrack"><i style="width:${pct}%"></i></span><span class="num">${v}/${max}</span></div>`;
  }

  function renderTogether() {
    if (!STANDALONE) return "";
    if (!net.api && location.protocol === "file:") return `<div class="together"><h2>Play together</h2>
      <p class="small">Sessions don't work when the page is opened as a file (the address starts with <code>file://</code>). Open it from its web address instead: the live site, or <b>http://localhost:8000</b> while testing. Your sheet still works on its own.</p></div>`;
    if (!net.api) return net.status === "error"
      ? `<div class="together"><h2>Play together</h2><p class="small">Couldn't reach the session server (${esc(net.error)}). Check your internet connection. Ad and tracker blockers often cause this, including the ones built into Opera GX and Brave: turn them off for this site (the shield icon in the address bar), then reload. Your sheet still works on its own.</p></div>`
      : `<p class="small muted">Connecting to the session server…</p>`;
    if (inRoom()) return `<div class="together"><h2>Session <span class="num">${esc(net.code)}</span></h2><p class="small">You're in. Pick a class below and you'll appear at the table.</p><div class="actions">${btn("leave", null, "Leave session", "tiny")}</div></div>`;
    return `<div class="together">
      <h2>Play together</h2>
      <div class="wear-row"><input id="u-joinCode" type="text" data-ui="joinCode" value="${esc(ui.joinCode)}" placeholder="Room code, e.g. GREI-4821" aria-label="Room code">${btn("join", null, "Join session", "primary tiny")}</div>
      <p class="small muted">Running the game? ${btn("dm-start", null, "Start a session as DM", "tiny")}</p>
    </div>`;
  }

  function renderSessionPanel() {
    if (inRoom()) {
      const n = Object.values(net.players).filter(p => p && p.online).length;
      return `<div class="rest-panel" role="group" aria-label="Session">
        <div class="rest-opt"><b>Session <span class="num">${esc(net.code)}</span></b>
          <p>${n} player${n === 1 ? "" : "s"} online. Your HP, prayer, AC and rolls are shared with the table.</p>
          <div class="row">${btn("copy-link", null, "Copy invite link", "tiny")}${btn("leave", null, "Leave session", "tiny danger")}</div></div>
      </div>`;
    }
    return `<div class="rest-panel" role="group" aria-label="Join a session">
      <div class="rest-opt"><b>Join a session</b><p>Ask the DM for the room code.</p>
        <div class="row"><input id="u-joinCode" type="text" data-ui="joinCode" value="${esc(ui.joinCode)}" placeholder="GREI-4821" aria-label="Room code" style="width:9em">${btn("join", null, "Join", "primary tiny")}</div></div>
      <div class="rest-opt"><b>Running the game?</b><p>Open the DM screen and get a room code to share. Your own sheet stays saved here.</p>
        <div class="row">${btn("dm-start", null, "Start a session as DM", "tiny")}</div></div>
    </div>`;
  }

  function renderOrderBlock(dm) {
    const o = turnOrder(), t = (net.meta && net.meta.turn) | 0, round = (net.meta && net.meta.round) || 1;
    const rows = o.map((e, i) => {
      const isP = e.k === "p", p = isP ? net.players[e.id] : null, en = isP ? null : enemyPub(e.id);
      const init = isP ? (p ? p.init : null) : (en ? en.init : null);
      const tags = [];
      if (isP && e.id === net.uid) tags.push(["you", "you"]);
      if (en && en.down) tags.push(["down", "down"]); else if (en && en.bloodied) tags.push(["bloodied", "bloodied"]);
      if (p && p.hp <= 0) tags.push((p.death || {}).f >= 3 ? ["dead", "dead"] : ["down", "down"]);
      if (p && !p.online) tags.push(["", "offline"]);
      return `<li class="${i === t ? "current" : ""}${isP ? "" : " enemy"}">
        <span class="num oi">${init === null || init === undefined ? "–" : init}</span><span class="on">${esc(entryName(e))}</span>
        ${tags.map(([c, l]) => `<span class="otag ${c}">${l}</span>`).join("")}
        ${dm ? `<span class="octl">${btn("ord-up", i, "↑", "icon tiny", i === 0, ` aria-label="Move up"`)}${btn("ord-down", i, "↓", "icon tiny", i === o.length - 1, ` aria-label="Move down"`)}${btn("ord-del", i, "×", "icon tiny danger", false, ` aria-label="Remove from turn order"`)}</span>` : ""}
      </li>`;
    }).join("");
    let extra = "";
    if (dm) {
      const inO = new Set(o.map(e => e.k + ":" + e.id));
      const missing = Object.entries(net.players).filter(([id]) => !inO.has("p:" + id)).map(([id, p]) => btn("ord-add", "p:" + id, "+ " + esc(p.name || "Player"), "tiny"))
        .concat(Object.entries(net.enemies).filter(([id]) => !inO.has("e:" + id)).map(([id, en]) => btn("ord-add", "e:" + id, "+ " + esc(en.name), "tiny")));
      extra = `<div class="actions">${btn("dm-build", null, "Sort by initiative", "tiny primary")}${btn("dm-end-combat", null, "Clear turn order", "tiny")}</div>
        ${missing.length ? `<div class="save-grid">${missing.join("")}</div>` : ""}`;
    }
    return `<div class="panel-head"><h2>Turn order</h2><span class="sub">Round <span class="num">${round}</span>${o.length ? ` · ${esc(entryName(o[t]))}'s turn` : ""}</span></div>
      ${o.length ? `<ol class="order">${rows}</ol>` : `<p class="empty">${dm ? "Have everyone roll initiative, add your enemies and roll theirs, then sort by initiative." : "No turn order yet. Roll initiative from your abilities panel when the DM asks."}</p>`}
      ${!dm && myTurn() ? `<p class="small" style="margin:0"><b>It's your turn.</b> Press End turn when you're done.</p>` : ""}
      ${extra}`;
  }

  function renderPartyBlock() {
    const ps = Object.entries(net.players).filter(([, p]) => p).sort((a, b) => String(a[1].name).localeCompare(String(b[1].name)));
    const cards = ps.map(([id, p]) => {
      const ac = p.ac || {}, dth = p.death || {};
      let st = "";
      if (p.hp <= 0) st = dth.f >= 3 ? `<span class="otag dead">dead</span>` : dth.s >= 3 ? `<span class="otag">stable</span>` : `<span class="otag down">down · ${dth.s | 0} saved · ${dth.f | 0} failed</span>`;
      return `<div class="pc${p.online ? "" : " off"}">
        <div class="pc-head"><i class="dot${p.online ? " on" : ""}" title="${p.online ? "Online" : "Offline"}"></i><b>${esc(p.name || "Unnamed")}</b><span class="small muted">${esc((CLASSES[p.cls] || {}).name || "")}${id === net.uid ? " · you" : ""}</span>${st}</div>
        ${mbar("HP", p.hp | 0, p.hpMax | 0, "hp")}${mbar("Prayer", p.pp | 0, p.ppMax | 0, "pray")}${mbar("Special", p.spec | 0, 100, "spec")}
        <div class="small muted">AC <span class="num">${ac.melee}/${ac.ranged}/${ac.magic}</span> · ${p.speed} ft${p.exh ? ` · exhaustion ${p.exh}` : ""}${p.init !== null && p.init !== undefined ? ` · init ${p.init}` : ""}</div>
        ${p.prayers ? `<div class="small">Praying: ${esc(Object.values(p.prayers).join(", "))}</div>` : ""}
      </div>`;
    }).join("");
    return `<div class="panel-head"><h2>Party</h2><span class="sub">${ps.filter(([, p]) => p.online).length} online</span></div>
      <div class="party">${cards || `<p class="empty">No one has joined yet.</p>`}</div>`;
  }

  function renderFeedBlock(dm) {
    let items = net.log.slice();
    if (dm) items = items.concat(Object.entries((net.dm && net.dm.log) || {}).map(([id, e]) => Object.assign({ id, secret: true }, e)));
    items.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    const li = items.slice(0, 80).map(e => `<li class="${e.secret ? "secret" : ""}"><span class="t">${e.ts ? new Date(e.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""}</span><span><b>${esc(e.name || "")}</b>${e.secret ? ` <span class="otag">only you</span>` : ""} ${esc(e.text || "")}</span></li>`).join("");
    return `<div class="panel-head"><h2>Table feed</h2>${dm ? btn("dm-clear-feed", null, "Clear feed", "tiny danger") : `<span class="sub">Everyone's rolls and actions</span>`}</div>
      <ul class="log feed">${li || `<li class="empty">Nothing yet.</li>`}</ul>`;
  }

  function renderTable() {
    return `<section class="table-grid" aria-label="Session ${esc(net.code)}">
      <div class="panel">${renderOrderBlock(false)}${renderPartyBlock()}</div>
      <div class="panel">${renderFeedBlock(false)}</div>
    </section>`;
  }

  // DM editor for one enemy's attacks and abilities: every number and die can change, and actions can be added or removed
  function renderEnemyEditor(key) {
    const dr = ui.enDraft || { actions: [], multi: "" };
    const top = (k, ph, w, label) => `<label class="small">${label} <input type="text" id="ed-${k}" data-edraft="${k}" value="${esc(dr[k] === undefined || dr[k] === null ? "" : dr[k])}" placeholder="${ph}" aria-label="${label}" style="width:${w}"></label>`;
    const f = (i, k, ph, w, label) => `<input type="text" id="ed-${i}-${k}" data-edraft="${i}:${k}" value="${esc(dr.actions[i][k] === undefined || dr.actions[i][k] === null ? "" : dr.actions[i][k])}" placeholder="${ph}" aria-label="${label}" style="width:${w}">`;
    const rows = dr.actions.map((a, i) => `<div class="act-edit">
        <div class="act-row">${f(i, "n", "Name", "100%", "Action name")}</div>
        ${a.dnd ? `<div class="small muted">Original ${esc(a.dnd)}</div>` : ""}
        <div class="act-row">
          <select id="ed-${i}-k" data-edraft="${i}:k" aria-label="Kind of action">${[["attack", "Attack roll"], ["save", "Saving throw"], ["other", "Other"]].map(([v, l]) => `<option value="${v}"${a.k === v ? " selected" : ""}>${l}</option>`).join("")}</select>
          ${a.k === "attack" ? `<label class="small">To hit ${f(i, "hit", "+5", "3.5em", "To-hit bonus")}</label>` : ""}
          ${f(i, "reach", "reach 5 ft / range 80/320 ft", "11em", "Reach or range")}
        </div>
        <div class="act-row">
          <label class="small">Damage ${f(i, "dmg", "1d8+3", "5.5em", "Damage dice")}</label>${f(i, "type", "type", "6.5em", "Damage type")}
          <label class="small">Extra ${f(i, "plus", "2d6", "4.5em", "Extra damage dice")}</label>${f(i, "plusType", "type", "6.5em", "Extra damage type")}
        </div>
        <textarea id="ed-${i}-note" data-edraft="${i}:note" placeholder="Note: save DC, conditions, when extra damage applies" aria-label="Note" rows="2">${esc(a.note || "")}</textarea>
        <div class="act-row">${btn("en-draft-del", i, "Remove this action", "tiny danger")}</div>
      </div>`).join("");
    return `<div class="en-editor">
      <div class="act-row">${top("name", "Name", "11em", "Name")}${top("hpMax", "20", "3.5em", "Max HP")}${top("ac", "12 or 12/12/9", "8em", "AC")}${top("init", "+2", "3.5em", "Init")}</div>
      <div class="act-row">${STAT_KEYS.map(([k, U]) => top(k, "", "3.2em", U)).join("")}</div>
      <p class="small muted" style="margin:0">AC is one number, or melee/ranged/magic like <code>12/12/9</code>, with <code>immune</code> for any it can't be hurt by. MGC above 1 lets it cast any spell up to that level. Leave Init blank to work it out from AGI.</p>
      <label class="small" for="ed-multi">Multiattack</label>
      <input type="text" id="ed-multi" data-edraft="multi" value="${esc(dr.multi || "")}" placeholder="e.g. Two Claw attacks (leave blank for none)">
      ${rows || `<p class="empty">No actions. Add one below.</p>`}
      <p class="small muted" style="margin:0">Dice look like <code>1d8+3</code>, <code>2d6-1</code> or a flat <code>4</code>. Extra damage is rolled on every hit; put conditional extras in the note.</p>
      <div class="actions">${btn("en-draft-add", null, "Add an action", "tiny")}${btn("en-edit-save", key, "Save changes", "tiny primary")}${btn("en-edit-cancel", null, "Cancel", "tiny")}</div>
    </div>`;
  }

  function renderEnemiesDM() {
    const priv = (net.dm && net.dm.enemies) || {};
    const inO = new Set(turnOrder().filter(e => e.k === "e").map(e => e.id));
    const rows = Object.entries(net.enemies).map(([id, en]) => {
      const pv = priv[id] || {};
      return `<div class="enemy${ui.enEdit === id ? " editing" : ""}">
        <div class="pc-head"><b>${esc(en.name)}</b><span class="small muted">AC ${acLabel(pv.ac, true)} · init ${en.init === undefined || en.init === null ? "–" : en.init}</span>${en.down ? `<span class="otag down">down</span>` : en.bloodied ? `<span class="otag bloodied">bloodied</span>` : ""}</div>
        ${statsLine(pv) ? `<div class="small muted en-stats">${esc(statsLine(pv))}</div>` : ""}
        ${mbar("HP", pv.hp | 0, pv.hpMax | 0, "hp")}
        ${ui.enEdit === id ? renderEnemyEditor(id) : `
        ${pv.multi ? `<div class="small"><b>Multiattack:</b> ${esc(pv.multi)}</div>` : ""}
        ${Array.isArray(pv.actions) && pv.actions.length && !en.down ? `<div class="actions">${pv.actions.map((a, i) => btn("en-act", id + "~" + i, a.k === "attack" ? `${esc(a.n)} ${fmt(a.hit)}${a.dmg ? " · " + esc(a.dmg) : ""}` : esc(a.n), a.k === "attack" ? "tiny primary" : "tiny")).join("")}</div>` : ""}
        ${monsterSpells(pv.magic).length && !en.down ? (() => {
          const list = monsterSpells(pv.magic), pick = ui.enSpell[id] || (list.filter(s => s.d).pop() || list[list.length - 1]).n, m = Math.floor((pv.magic | 0) / 10);
          return `<div class="act-row"><select id="u-enSpell-${esc(id)}" data-enspell="${esc(id)}" aria-label="Spell for ${esc(en.name)}">${list.map(s => `<option value="${esc(s.n)}"${s.n === pick ? " selected" : ""}>${esc(s.n)} (${s.l})${s.d ? ` ${s.d}${fmt(m)}` : ""}</option>`).join("")}</select>${btn("en-cast", id, "Cast", "tiny primary")}</div>`;
        })() : ""}
        ${pv.actions || pv.traits || pv.magic > 1 ? actionDetails(pv, pv.from || en.name) : ""}`}
        <div class="actions">${pv.atk !== null && pv.atk !== undefined && !en.down && ui.enEdit !== id ? btn("en-atk", id, `Attack ${fmt(pv.atk)}${pv.dmg ? " · " + esc(pv.dmg) : ""}`, "tiny primary") : ""}${ui.enEdit === id ? "" : btn("en-edit", id, "Edit", "tiny")}${btn("en-dmg", id, "Damage", "tiny")}${btn("en-heal", id, "Heal", "tiny")}${btn("en-bloody", id, en.bloodied ? "Not bloodied" : "Mark bloodied", "tiny")}${btn("en-init", id, "Roll initiative", "tiny")}${inO.has(id) ? "" : btn("ord-add", "e:" + id, "Add to turn order", "tiny")}${btn("en-del", id, "Remove", "tiny danger")}</div>
      </div>`;
    }).join("");
    return `<section class="panel" aria-labelledby="h-enemies">
      <div class="panel-head"><h2 id="h-enemies">Enemies in this fight</h2><span class="sub">Players see names, bloodied and down, never HP or AC</span></div>
      <div class="wear-row"><label class="small" for="u-eAmt">Amount</label><input id="u-eAmt" type="number" min="0" data-ui="eAmt" value="${ui.eAmt}"><span class="small muted">for Damage and Heal</span></div>
      <div class="party">${rows || `<p class="empty">No enemies yet.</p>`}</div>
      <div class="custom-armour">
        <input id="u-enName" type="text" data-ui="enName" value="${esc(ui.enName)}" placeholder="Enemy name" aria-label="Enemy name">
        HP <input id="u-enHp" type="number" min="1" data-ui="enHp" value="${ui.enHp}" aria-label="Enemy HP">
        AC <input id="u-enAc" type="text" data-ui="enAc" value="${esc(ui.enAc)}" placeholder="12 or 12/12/9" aria-label="Enemy AC, one number or melee/ranged/magic" style="width:7em;flex:none">
        Init + <input id="u-enInit" type="number" data-ui="enInit" value="${ui.enInit}" aria-label="Enemy initiative bonus">
        × <input id="u-enCount" type="number" min="1" max="12" data-ui="enCount" value="${ui.enCount}" aria-label="How many">
        ${btn("en-add", null, "Add", "tiny primary")}
      </div>
    </section>`;
  }

  function renderDmDice() {
    const dice = [4, 6, 8, 10, 12, 20, 100].map(s => btn("dm-dice", s, "d" + s, "tiny")).join("");
    const r = ui.dmLast;
    return `<section class="panel" aria-labelledby="h-dmdice">
      <div class="panel-head"><h2 id="h-dmdice">DM dice</h2><span class="sub dice"><input id="u-dmN" type="number" min="1" max="20" data-ui="dmN" value="${ui.dmN}" aria-label="Number of dice"> dice, mod <input id="u-dmMod" type="number" data-ui="dmMod" value="${ui.dmMod}" aria-label="Modifier"></span></div>
      <div class="dice">${dice}${chip("dmSecret", "Secret roll")}</div>
      <div class="roll-out" aria-live="polite">${r ? `${esc(r.label)}: ${esc(r.detail)}<b>${r.total}</b>` : `<span class="muted small" style="font-family:var(--f-body)">Public rolls go to the table feed. Secret rolls only you see.</span>`}</div>
    </section>`;
  }

  function renderBestiary() {
    const q = (ui.bestQ || "").trim().toLowerCase();
    const n = clamp(ui.bQty | 0 || 1, 1, 12);
    const rows = bestiary.map((p, i) => ({ p, i }))
      .filter(({ p }) => !q || `${p.name} ${p.notes || ""}`.toLowerCase().includes(q))
      .map(({ p, i }) => ui.enEdit === "b:" + i ? `<div class="enemy editing"><div class="pc-head"><b>Editing ${esc(p.name)}</b></div>${renderEnemyEditor("b:" + i)}</div>` : `<div class="enemy">
        <div class="pc-head"><b>${esc(p.name)}</b><span class="small muted">HP <span class="num">${p.hp}</span> · AC ${acLabel(p.ac, true)} · init ${fmt(p.init | 0)}${p.atk !== null && p.atk !== undefined ? ` · attack ${fmt(p.atk)}${p.dmg ? " " + esc(p.dmg) : ""}` : ""}</span></div>
        ${statsLine(p) ? `<div class="small muted en-stats">${esc(statsLine(p))}</div>` : ""}
        ${p.actions && p.actions.length ? `<div class="small">${p.actions.filter(a => a.k === "attack").map(a => `${esc(a.n)} <span class="num">${fmt(a.hit)}</span> ${esc(dmgLabel(a))}`).join(" · ") || "No attacks"}${p.multi ? ` <span class="muted">(${esc(p.multi.replace(/\.$/, ""))})</span>` : ""}</div>` : ""}
        ${monsterSpells(p.magic).length ? `<div class="small">Casts spells up to level <span class="num">${p.magic | 0}</span></div>` : ""}
        ${p.actions || p.traits ? actionDetails(p, p.name) : ""}
        <div class="actions">${btn("best-spawn", i, n > 1 ? `Add ${n} to fight` : "Add to fight", "tiny primary")}${btn("best-edit", i, "Edit", "tiny")}${btn("best-del", i, "Delete", "tiny danger")}</div>
      </div>`).join("");
    const msg = ui.importMsg;
    let tool = "";
    if (ui.bestTool === "import") {
      tool = `<div class="rest-opt">
        <b>Import a list</b>
        <p>One enemy per line: <b>name, HP, AC</b>, then optionally initiative bonus, attack bonus, damage and notes. For example: <code>Goblin, 8, 11, +1, +3, 1d6, weak to air</code>. You can paste rows from a spreadsheet, or load a .csv, .txt or .json file. An enemy with the same name as one you have replaces it.</p>
        <p class="small" style="margin:0">To add Grei's stats, start with a header row naming the columns, like <code>name, hp, ac, att, str, rng, mgc, pra, agi</code> (Download template has one). You can also paste lines straight from Grei's monster pages, like <code>GOBLIN MINION: HP: 10, ATT: 10, STR: 10, RNG: 1, MGC: 1, PRA: 30, AGI: 20</code> together with its <code>MELEE AC 12, RANGED AC 12, MAGIC AC 9</code> line. Initiative and spells work themselves out from AGI and MGC.</p>
        <p class="small muted" style="margin:0">A CSV line holds one attack. For more attacks, saves and multiattacks, click Edit on the enemy after importing, or load a file made with Download everything.</p>
        <p>For separate melee, ranged and magic AC, write all three in that order with slashes, and <code>immune</code> for any it can't be hurt by:</p>
        <ul class="small" style="margin:0;padding-left:1.2em">
          <li><code>Goblin minion, 10, 12/12/9, +2, +1</code> is melee AC 12, ranged AC 12, magic AC 9</li>
          <li><code>Armoured wraith, 20, 12/immune/15, +2, +3, 1d8</code> is melee AC 12, immune to ranged, magic AC 15</li>
        </ul>
        <textarea id="u-bestText" data-ui="bestText" style="min-height:120px" placeholder="Goblin, 8, 11, +1, +3, 1d6, weak to air&#10;Goblin minion, 10, 12/12/9, +2, +1&#10;Armoured wraith, 20, 12/immune/15, +2, +3, 1d8" aria-label="Enemies to import">${esc(ui.bestText)}</textarea>
        <div class="row">${btn("best-import", null, "Import", "primary tiny")}${btn("best-file", null, "Load a file", "tiny")}${btn("best-template", null, "Download template", "tiny")}</div>
      </div>`;
    } else if (ui.bestTool === "add") {
      tool = `<div class="rest-opt">
        <b>Add one enemy</b>
        <div class="custom-armour">
          <input id="u-bName" type="text" data-ui="bName" value="${esc(ui.bName)}" placeholder="Name" aria-label="Name">
          HP <input id="u-bHp" type="number" min="1" data-ui="bHp" value="${ui.bHp}" aria-label="HP">
          AC <input id="u-bAc" type="text" data-ui="bAc" value="${esc(ui.bAc)}" placeholder="12 or 12/12/9" aria-label="AC, one number or melee/ranged/magic" style="width:7em;flex:none">
          Init + <input id="u-bInit" type="text" data-ui="bInit" value="${esc(ui.bInit)}" placeholder="from AGI" aria-label="Initiative bonus, blank to use AGI" style="width:5.5em;flex:none">
        </div>
        <div class="custom-armour stat-boxes">${STAT_KEYS.map(([k, U]) => `<label class="small">${U} <input id="u-b${U}" type="text" inputmode="numeric" data-ui="b${U}" value="${esc(ui["b" + U] || "")}" aria-label="${U}" style="width:3.2em;flex:none"></label>`).join("")}</div>
        <div class="custom-armour">
          Attack <input id="u-bAtk" type="text" data-ui="bAtk" value="${esc(ui.bAtk)}" placeholder="+3" aria-label="Attack bonus" style="width:4em;flex:none">
          Damage <input id="u-bDmg" type="text" data-ui="bDmg" value="${esc(ui.bDmg)}" placeholder="1d6" aria-label="Damage dice" style="width:5em;flex:none">
          <input id="u-bNotes" type="text" data-ui="bNotes" value="${esc(ui.bNotes)}" placeholder="Notes, e.g. weak to air" aria-label="Notes">
        </div>
        <div class="row">${btn("best-add", null, "Save to bestiary", "primary tiny")}<span class="small muted">To give it more attacks, saves or a multiattack, save it and then click Edit on its card.</span></div>
      </div>`;
    }
    return `<section class="panel" aria-labelledby="h-best">
      <div class="panel-head"><h2 id="h-best">Bestiary</h2><span class="sub">${bestiary.length} prepared · saved on this device · none join the fight until you add them</span></div>
      <div class="actions">
        ${btn("best-tool", "import", "Import a list", ui.bestTool === "import" ? "tiny primary" : "tiny")}
        ${btn("best-tool", "add", "Add one", ui.bestTool === "add" ? "tiny primary" : "tiny")}
        ${btn("best-grei", null, "Load Grei's monsters", "tiny")}
        ${btn("best-export", null, "Download as CSV", "tiny", !bestiary.length)}
        ${btn("best-export-json", null, "Download everything", "tiny", !bestiary.length)}
        ${bestiary.length ? btn("best-clear", null, ui.bestClearArm ? "Click again to delete all" : "Delete all", "tiny danger") : ""}
      </div>
      ${tool ? `<div class="rest-panel">${tool}</div>` : ""}
      ${msg ? `<div class="small" style="color:${msg.ok ? "var(--good)" : "var(--bad)"}">${esc(msg.text)}${msg.errors.length ? `<ul style="margin:4px 0 0;padding-left:18px;color:var(--bad)">${msg.errors.slice(0, 8).map(e => `<li>${esc(e)}</li>`).join("")}${msg.errors.length > 8 ? `<li>…and ${msg.errors.length - 8} more</li>` : ""}</ul>` : ""}</div>` : ""}
      ${bestiary.length ? `<div class="wear-row">
        ${bestiary.length > 6 ? `<input id="u-bestQ" type="text" data-ui="bestQ" value="${esc(ui.bestQ)}" placeholder="Search the bestiary" aria-label="Search the bestiary" style="flex:1;min-width:8em">` : ""}
        <label class="small" for="u-bQty">Add</label><input id="u-bQty" type="number" min="1" max="12" data-ui="bQty" value="${n}"><span class="small muted">at a time</span>
      </div>` : ""}
      <div class="party best-list" id="best-list" tabindex="0" aria-label="Prepared enemies">${rows || `<p class="empty">${bestiary.length ? "No matches." : "Nothing prepared yet. Import a list or add enemies one at a time."}</p>`}</div>
    </section>`;
  }

  const runeText = r => Object.entries(r || {}).map(([k, n]) => `${n > 1 ? n + " " : ""}${RUNE_NAME[k] || k}`).join(" + ");
  function renderDmSpellbook() {
    const rows = SPELLS.map(s => `<li><span class="rlvl">${s.l}</span><div><b>${esc(s.n)}</b>${s.d ? ` <span class="num">${s.d}</span> + magic bonus` : ""} <span class="muted small">· ${s.k === "Action" ? "action" : "bonus action"}</span>
        <div class="small">${esc(s.fx)}</div><div class="small muted">Runes: ${esc(runeText(s.r))}</div></div></li>`).join("");
    return `<section class="panel" aria-labelledby="h-dm-spells">
      <div class="panel-head"><h2 id="h-dm-spells">Spellbook</h2><span class="sub">${SPELLS.length} spells · magic bonus is +1 per 10 Magic</span></div>
      <ul class="ref-list" id="dm-spells" tabindex="0" aria-label="All spells by level">${rows}</ul>
    </section>`;
  }
  function renderDmPrayers() {
    const rows = PRAYERS.map(p => `<li><span class="rlvl">${p.l}</span><div><b>${esc(p.n)}</b> <span class="muted small">· drains <span class="num">${p.pp}</span> pp per turn</span>
        <div class="small">${esc(p.fx)}</div></div></li>`).join("");
    return `<section class="panel" aria-labelledby="h-dm-prayers">
      <div class="panel-head"><h2 id="h-dm-prayers">Prayers</h2><span class="sub">Activating is a bonus action, up to 3 at once · priests pay half on themselves, 75% on allies</span></div>
      <ul class="ref-list" id="dm-prayers" tabindex="0" aria-label="All prayers by level">${rows}</ul>
    </section>`;
  }

  function renderDM() {
    const m = net.meta || {};
    return `<header class="bar"><div class="bar-inner">
        <div class="who"><h1 style="font-size:1.5rem">DM screen</h1><span class="tag">Room <span class="num">${esc(net.code)}</span></span></div>
        <div class="turn"><span class="label">Round</span><span class="turn-count">${m.round || 1}</span>${btn("dm-prev", null, "Undo turn", "", !turnOrder().length || ((m.round || 1) <= 1 && !(m.turn | 0)), ` title="Move the turn back one step"`)}${btn("dm-next", null, "Next turn", "primary", !turnOrder().length)}</div>
        <div class="actions">${btn("copy-link", null, "Copy invite link")}${btn("rules", null, "Rulebook")}${btn("leave", null, "Leave session")}</div>
        <span class="status" id="status" data-s="saved">Players join with ${esc(net.code)}</span>
      </div></header>
      <main class="wrap">
        <div class="grid">
          <div class="col"><section class="panel">${renderOrderBlock(true)}</section>${renderEnemiesDM()}<section class="panel">${renderPartyBlock()}</section></div>
          <div class="col">${renderDmDice()}${renderBestiary()}<section class="panel">${renderFeedBlock(true)}</section></div>
        </div>
        <div class="grid">
          <div class="col">${renderDmSpellbook()}</div>
          <div class="col">${renderDmPrayers()}</div>
        </div>
      </main>`;
  }

  function render() {
    const a = document.activeElement;
    const fid = a && a.id ? a.id : null;
    let selS = null, selE = null;
    try { if (a && "selectionStart" in a) { selS = a.selectionStart; selE = a.selectionEnd; } } catch (e) {}
    const logEl = document.querySelector(".log");
    const logScroll = logEl ? logEl.scrollTop : 0;
    const keepScroll = ["best-list", "dm-spells", "dm-prayers"].map(id => [id, (document.getElementById(id) || {}).scrollTop || 0]);
    // Keep a half-typed value in a sheet field when a live update redraws the page
    const keepVal = a && a.id && a.dataset && a.dataset.field && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") ? a.value : null;

    if (isDM()) {
      document.getElementById("app").innerHTML = renderDM();
    } else if (!state.cls) {
      document.getElementById("app").innerHTML = renderChooser();
    } else {
      document.getElementById("app").innerHTML =
        renderBar() +
        `<main class="wrap">
          ${renderVitals()}
          ${state.hp <= 0 ? renderDeath() : ""}
          ${inRoom() ? renderTable() : ""}
          ${renderCombat()}
          <div class="grid">
            <div class="col">${renderWeapon()}${renderAbilities()}${cdef().order.map(k => MAIN[k]()).join("")}</div>
            <div class="col">${renderArmour()}${renderRunes()}${renderStats()}${renderItems()}${renderShop()}${renderDice()}${renderSaves()}${renderSkills()}${renderLog()}${renderNotes()}</div>
          </div>
        </main>`;
    }

    if (fid) {
      const el = document.getElementById(fid);
      if (el) {
        el.focus({ preventScroll: true });
        if (keepVal !== null && "value" in el && el.value !== keepVal) el.value = keepVal;
        try { if (selS !== null) el.setSelectionRange(selS, selE); } catch (e) {}
      }
    }
    const nl = document.querySelector(".log");
    if (nl) nl.scrollTop = logScroll;
    for (const [id, top] of keepScroll) { const el = document.getElementById(id); if (el) el.scrollTop = top; }
  }

  /* ================= Actions ================= */
  function endTurn() {
    // In a session you can only end your own turn, and only once per turn
    if (inRoom() && !isDM()) {
      if (!myTurn()) { toast(turnOrder().length ? `It's ${entryName(currentEntry())}'s turn` : "There's no turn order yet"); return; }
      const key = `${net.meta.round || 1}:${net.meta.turn | 0}`;
      if (net.endedKey === key) return;
      net.endedKey = key;
      net.lastEnded = key;
    }
    mutate(() => {
      const notes = [];
      const before = state.spec;
      state.spec = clamp(state.spec + 10, 0, 100);
      if (state.spec !== before) notes.push(`spec ${state.spec}%`);
      const drain = drainPerTurn();
      if (drain) {
        if (state.pp >= drain) { state.pp -= drain; notes.push(`−${drain} prayer`); }
        else { state.pp = 0; state.prayersOn = []; state.allyPrayers = []; notes.push("out of prayer, prayers off"); }
      }
      if (hasPrayer("Rapid Regeneration") && state.hp < hpMax()) {
        state.hp = clamp(state.hp + 5, 0, hpMax()); notes.push("+5 HP regen");
      }
      const preserve = hasPrayer("Preserve");
      const ended = new Set();
      state.effects = state.effects.filter(e => {
        if (!(e.turns > 0)) return true;
        if (e.potion && preserve) return true;
        e.turns -= 1;
        if (e.turns === 0) { ended.add(e.label); return false; }
        return true;
      });
      for (const l of ended) notes.push(`${l} ended`);
      if (preserve && state.effects.some(e => e.potion)) notes.push("Preserve held potion effects");
      state.ate = 0;
      if (state.innAdv) { state.innAdv = false; notes.push("inn advantage used"); }
      const t = state.turn;
      state.turn += 1;
      state.log.unshift({ t, m: "End of turn" + (notes.length ? ": " + notes.join(", ") : "") });
      if (state.log.length > 80) state.log.length = 80;
      return null;
    });
    if (inRoom() && !isDM()) {
      pushShared(state.log[0] ? state.log[0].m : "Ended their turn");
      if (myTurn()) { advanceTurn(); return; }
    }
    toast(`Turn ${state.turn}`);
  }

  function setRoll(label, expr, m) {
    const r = rollDice(expr);
    if (!r) return "";
    const total = r.total + (m || 0);
    const detail = r.rolls.join(" + ") + (m ? (m > 0 ? " + " : " − ") + Math.abs(m) : "") + " =";
    state.lastRoll = { label: `${label} (${expr}${m ? (m > 0 ? "+" : "") + m : ""})`, detail, total };
    return `${expr}${m ? (m > 0 ? "+" : "") + m : ""} → ${total}`;
  }

  function longRest(kind, extra) {
    ui.restOpen = false;
    mutate(() => {
      if (kind === "bedroll") state.hp = Math.max(state.hp, hpMax());
      if (kind === "inn") state.hp = hpMax() + extra;
      state.innAdv = kind === "inn";
      state.pp = ppMax(); state.spec = 100; state.exh = 0; state.daily = {};
      return `Long rest (${kind}): HP ${state.hp}, prayer ${state.pp}, special 100%, exhaustion 0`;
    });
  }

  // Put the wielded weapon back in the pack and take the new one out of it
  function wieldByName(name) {
    const old = state.weapon;
    if ((old || "").toLowerCase() === (name || "").toLowerCase()) return null;
    if (old) {
      const have = state.items.find(x => x.name.toLowerCase() === old.toLowerCase());
      if (have) have.qty = (have.qty | 0) + 1; else state.items.push({ name: old, qty: 1 });
    }
    if (name) {
      const i = state.items.findIndex(x => x.name.toLowerCase() === name.toLowerCase() && (x.qty | 0) > 0);
      if (i >= 0) { state.items[i].qty -= 1; if (state.items[i].qty <= 0) state.items.splice(i, 1); }
      state.weapon = (weaponInfo(name) || { n: name }).n;
    } else state.weapon = null;
    return name ? `Wielding ${state.weapon}` : "Put weapon away";
  }

  const handlers = {
    "choose": arg => {
      if (!CLASSES[arg]) return;
      snapshot();
      state = freshState(arg);
      state.name = ui.newName.trim();
      ui.newName = "";
      persist(); render();
      toast(`${state.name || "Your"} ${CLASSES[arg].name} is ready`);
    },
    "end-turn": endTurn,
    "session": () => { ui.sessOpen = !ui.sessOpen; ui.restOpen = false; render(); },
    "join": () => openRoom(ui.joinCode, "player"),
    "dm-start": async () => {
      if (!net.api) { toast("Still connecting to the session server"); return; }
      try { const code = await net.api.createRoom(); await openRoom(code, "dm"); }
      catch (e) { toast("Couldn't start a session. Check your connection."); }
    },
    "leave": () => leaveRoom(),
    "copy-link": () => {
      const link = `${location.origin}${location.pathname}?room=${net.code}`;
      try { navigator.clipboard.writeText(link).then(() => toast("Invite link copied"), () => toast(link)); }
      catch (e) { toast(link); }
    },
    "dm-next": () => { if (isDM()) advanceTurn(); },
    "dm-prev": () => {
      const o = turnOrder();
      if (!isDM() || !o.length || !net.meta) return;
      let t = (net.meta.turn | 0) - 1, round = net.meta.round || 1;
      if (t < 0) {
        if (round <= 1) { toast("Already at the start of round 1"); return; }
        t = o.length - 1; round -= 1;
      }
      net.api.setMeta({ turn: t, round, turnId: o[t].id })
        .then(() => pushShared(`moved the turn back to ${entryName(o[t])} (round ${round})`))
        .catch(() => toast("Couldn't move the turn back"));
    },
    "dm-build": () => {
      if (!isDM()) return;
      const list = [];
      for (const [id, p] of Object.entries(net.players)) if (p && p.init !== null && p.init !== undefined) list.push({ k: "p", id, init: p.init, pl: 1 });
      for (const [id, en] of Object.entries(net.enemies)) if (en.init !== null && en.init !== undefined && !en.down) list.push({ k: "e", id, init: en.init, pl: 0 });
      if (!list.length) { toast("Nobody has rolled initiative yet"); return; }
      list.sort((a, b) => b.init - a.init || b.pl - a.pl);
      const o = list.map(({ k, id }) => ({ k, id }));
      net.api.setMeta({ order: o, turn: 0, round: 1, turnId: o[0].id }).then(() => pushShared(`Turn order: ${o.map(entryName).join(", ")}`));
    },
    "dm-end-combat": () => { if (isDM()) net.api.setMeta({ order: null, turn: 0, round: 1, turnId: null }); },
    "ord-add": arg => {
      if (!isDM()) return;
      const [k, id] = String(arg).split(":");
      const o = turnOrder().concat([{ k, id }]);
      net.api.setMeta({ order: o, turnId: (o[(net.meta && net.meta.turn) | 0] || {}).id || null });
    },
    "ord-up": arg => moveOrder(toInt(arg), -1),
    "ord-down": arg => moveOrder(toInt(arg), 1),
    "ord-del": arg => {
      if (!isDM()) return;
      const i = toInt(arg), o = turnOrder().slice();
      let t = (net.meta && net.meta.turn) | 0;
      o.splice(i, 1);
      if (i < t) t -= 1;
      if (t >= o.length) t = 0;
      net.api.setMeta({ order: o.length ? o : null, turn: t, turnId: o[t] ? o[t].id : null });
    },
    "en-add": () => {
      if (!isDM()) return;
      const name = ui.enName.trim();
      if (!name) { toast("Name the enemy first"); return; }
      const hp = Math.max(1, ui.enHp | 0), n = clamp(ui.enCount | 0 || 1, 1, 12);
      const ac = parseAc(ui.enAc);
      if (ac === undefined) { toast("AC needs to be a number, or melee/ranged/magic like 12/12/9"); return; }
      for (let i = 1; i <= n; i++) {
        net.api.setEnemy(net.api.newId(), { name: n > 1 ? `${name} ${i}` : name, bloodied: false, down: false },
          { hp, hpMax: hp, ac, initBonus: ui.enInit | 0 });
      }
      ui.enName = "";
      render();
    },
    "en-dmg": arg => hurtEnemy(arg, -Math.max(0, ui.eAmt | 0)),
    "en-heal": arg => hurtEnemy(arg, Math.max(0, ui.eAmt | 0)),
    "en-bloody": arg => {
      const en = enemyPub(arg);
      if (!isDM() || !en) return;
      net.api.patchEnemy(arg, { bloodied: !en.bloodied }, null);
      if (!en.bloodied) pushShared(`${en.name} is bloodied`);
    },
    "en-init": arg => {
      const en = enemyPub(arg), pv = ((net.dm && net.dm.enemies) || {})[arg] || {};
      if (!isDM() || !en) return;
      const r = d(20), total = r + (pv.initBonus | 0);
      net.api.patchEnemy(arg, { init: total }, null);
      pushShared(`${en.name} initiative ${total} (d20 ${r}${fmt(pv.initBonus | 0)})`, true);
    },
    "en-del": arg => {
      if (!isDM()) return;
      const i = turnOrder().findIndex(e => e.k === "e" && e.id === arg);
      if (i >= 0) handlers["ord-del"](i);
      net.api.removeEnemy(arg);
    },
    "dm-dice": arg => {
      const s = toInt(arg), n = clamp(ui.dmN | 0 || 1, 1, 20), m = ui.dmMod | 0;
      const rolls = Array.from({ length: n }, () => d(s)), total = rolls.reduce((a, b) => a + b, 0) + m;
      const expr = `${n}d${s}${m ? fmt(m) : ""}`;
      ui.dmLast = { label: `${ui.dmSecret ? "Secret " : ""}${expr}`, detail: rolls.join(" + ") + (m ? " " + fmt(m) : "") + " =", total };
      pushShared(`rolled ${expr}: ${total} [${rolls.join(", ")}]`, ui.dmSecret);
      render();
    },
    "dm-clear-feed": () => { if (isDM()) net.api.clearLog().catch(() => {}); },
    "en-atk": arg => {
      const en = enemyPub(arg), pv = ((net.dm && net.dm.enemies) || {})[arg] || {};
      if (!isDM() || !en || pv.atk === null || pv.atk === undefined) return;
      const r = d(20), hit = r + (pv.atk | 0);
      const dmg = pv.dmg ? rollDice(pv.dmg) : null;
      const nat = r === 20 ? " (nat 20!)" : r === 1 ? " (nat 1)" : "";
      const dmgTxt = dmg ? `, ${dmg.total} damage [${pv.dmg}: ${dmg.rolls.join("+")}${dmg.flat ? fmt(dmg.flat) : ""}]` : "";
      ui.dmLast = { label: `${en.name} attacks`, detail: `${hit} to hit${nat} [d20 ${r}${fmt(pv.atk | 0)}]${dmg ? " · damage" : ""} =`, total: dmg ? dmg.total : hit };
      pushShared(`${en.name} attacks: ${hit} to hit${nat} [d20 ${r}${fmt(pv.atk | 0)}]${dmgTxt}`, ui.dmSecret);
      render();
    },
    "statblock": name => {
      const url = statCards[name];
      if (!url) { toast("No stat block picture for that one. Load Grei's monsters again to get them"); return; }
      let dlg = document.getElementById("sb-dialog");
      if (!dlg) {
        dlg = document.createElement("dialog");

    "attack": () => {
      const w = wielded();

      const style = styleOf(w);

      const arrows = needsArrows(w) ? currentArrows() : null;
      if (needsArrows(w) && !arrows) { toast("No arrows left"); return; }
      let res;
      mutate(() => {
        let dmgBonus = 0;
        if (arrows) {
          const ai = itemInfo(arrows).ammo;
          arrows.qty -= 1; dmgBonus = ai.dmg;
          if (ai.poison) o.extra.push({ label: "poison", dice: ai.poison });
        }
        res = rollAttack({ style, dice: w.dmg, adv: o.adv, hitBonus: o.hitBonus, dmgBonus, extra: o.extra });
        state.lastRoll = { label: w.n, detail: res.text + " ·", total: res.dmg };
        return `${w.n}${vsTarget()}: ${res.text}${arrows ? ` (${arrows.qty} ${arrows.name.toLowerCase()} left)` : ""}`;
      });
      toast(`${w.n}: ${res.hit} to hit, ${res.dmg} damage`);
    },
    "special": () => {
      const w = wielded(), sp = w && SPECIALS[w.type];

      const cost = sp.cost || 0;

      const style = styleOf(w);
      if (w.type === "staff") {
        mutate(() => {
          state.spec -= cost;
          state.effects = state.effects.filter(e => !(e.label === "Boost" && e.stat === "magic"));
          state.effects.push({ label: "Boost", stat: "magic", amt: 15, turns: 2 });
          return `Boost: Magic ${eff("magic")} for 2 turns (spec ${state.spec}%)`;
        });
        toast(`Magic boosted to ${eff("magic")}`);

      }
      if (w.type === "battleaxe") {
        mutate(() => {
          state.spec -= cost;
          const amt = (state.stats.strength.base | 0) + gearLvl("strength");
          state.effects = state.effects.filter(e => e.label !== "Warcry");
          state.effects.push({ label: "Warcry", stat: "strength", amt, turns: 2 });
          return `Warcry: Strength ${eff("strength")} for 2 turns (spec ${state.spec}%)`;
        });
        toast(`Warcry: Strength ${eff("strength")}`);

      if (sp.kind === "utility") {
        mutate(() => { state.spec -= cost; return `${sp.n}: ${sp.desc} (spec ${state.spec}%)`; });
        toast(`${sp.n}: the enemy makes a STR 10 save or is pushed 15 ft`);
        return;
      }
      const hits = sp.hits || 1;
      const arrows = needsArrows(w) ? currentArrows() : null;

            arrows.qty -= 1; dmgBonus = ai.dmg;
            if (ai.poison) o.extra.push({ label: "poison", dice: ai.poison });

          if (sp.extra) o.extra.push({ label: sp.n, dice: sp.extra });
          results.push(rollAttack({ style, dice: w.dmg, adv: o.adv, hitBonus: o.hitBonus, dmgBonus, extra: o.extra }));
        }
        const total = results.reduce((a, r) => a + r.dmg, 0);
        state.lastRoll = hits > 1
          ? { label: sp.n, detail: results.map((r, i) => `#${i + 1} ${r.hit} to hit, ${r.dmg} dmg`).join(" · ") + " · total if all hit", total }

        return `${name} ${dc ? "save/check vs " + dc : "roll"}: ${total}${verdict ? " (" + verdict + ")" : ""}${nat === 20 ? " nat 20" : nat === 1 ? " nat 1" : ""}`;

      toast(`${name}: ${total}${verdict ? (verdict === "pass" ? ", passed" : ", failed") : ""}`);
    },
    "death-roll": () => {
      const ds = state.death || { s: 0, f: 0 };
      if (state.hp > 0 || ds.f >= 3 || ds.s >= 3) return;
      const r = d(20), pen = d20Pen(), total = r - pen;
      let msg;
      mutate(() => {
        if (r === 20) { state.hp = 1; state.death = { s: 0, f: 0 }; msg = "Natural 20: back up with 1 HP"; }
        else if (r === 1) { state.death = { s: ds.s, f: Math.min(3, ds.f + 2) }; msg = "Natural 1: two failures"; }
        else if (total >= 10) { state.death = { s: ds.s + 1, f: ds.f }; msg = `Success (${total})`; }
        else { state.death = { s: ds.s, f: ds.f + 1 }; msg = `Failure (${total})`; }
        if (state.death.f >= 3) msg += ". Three failures: dead";
        else if (state.death.s >= 3) msg += ". Three successes: stable";
        state.lastRoll = { label: "Death save", detail: `d20 ${r}${pen ? ` −${pen} exh` : ""} =`, total };
        return `Death save: ${msg}`;
      });
      toast(`Death save: ${msg}`);
    },
    "death-fail": arg => {
      const ds = state.death || { s: 0, f: 0 };
      if (ds.f >= 3) return;
      const n = toInt(arg) || 1;
      mutate(() => { state.death = { s: ds.s, f: Math.min(3, ds.f + n) }; return `Hit while down: ${n} death save failure${n > 1 ? "s" : ""}${state.death.f >= 3 ? ". Dead" : ""}`; });
    },
    "death-reset": () => mutate(() => { state.death = { s: 0, f: 0 }; return "Death saves cleared"; }),
    "pray": arg => {
      const p = PRAYERS[toInt(arg)];

        const on = state.prayersOn.includes(p.n);

        state.prayersOn.push(p.n);

        return `${p.n} on (${prayerCost(p, false)} pp/turn)`;

    },
    "pray-off": () => mutate(() => { state.prayersOn = []; state.allyPrayers = []; return "All prayers off"; }),
    "ally-add": () => {
      const p = PRAYER_BY[ui.allyPick];

    "ally-remove": arg => {
      const i = toInt(arg), a = state.allyPrayers[i];

    "gaze": () => mutate(() => { const b = state.hp; state.hp = clamp(state.hp + 5, 0, Math.max(hpMax(), state.hp)); return `Gaze of Zaros: +${state.hp - b} HP (HP ${state.hp})`; }),
    "surge": () => {

    },
    "drums": () => { if (state.daily.drums) return; mutate(() => { state.daily.drums = true; return "Drums of War: allies have advantage on attack and damage rolls for 2 turns"; }); toast("Drums of War: allies get advantage for 2 turns"); },
    "holybook": () => { if (state.daily.holybook) return; mutate(() => { state.daily.holybook = true; state.pp = ppMax(); return `Holy book: prayer restored to ${state.pp}`; }); toast("Prayer points restored"); },
    "rune": arg => {
      const [k, dir] = String(arg).split("-");

    "item": arg => {
      const [i, dir] = String(arg).split("-");
      const it = state.items[toInt(i)];

    "eat": arg => {
      const it = state.items[toInt(arg)];
      if (!it || it.qty <= 0 || state.ate >= 2) return;
      mutate(() => {
        it.qty -= 1; state.ate += 1;
        const h = Math.max(0, toInt(itemInfo(it).heal) - avarice());
        const b = state.hp;
        if (h > 0) state.hp = clamp(state.hp + h, 0, Math.max(hpMax(), state.hp));
        return `Ate ${it.name}${h ? ` (+${state.hp - b} HP)` : ""}, ${it.qty} left`;
      });
    },
    "drink": arg => {
      const it = state.items[toInt(arg)];
      const info = it && itemInfo(it);
      if (!it || it.qty <= 0 || !info || info.kind !== "potion") return;
      let msg = "";
      mutate(() => {
        it.qty -= 1;
        if (info.boost) {
          state.effects = state.effects.filter(e => e.label !== it.name);
          state.effects.push({ label: it.name, stat: info.boost, amt: 15, turns: 2, potion: true });
          msg = `${STAT_NAME[info.boost]} ${eff(info.boost)} for 2 turns`;
        } else if (info.prayer) {
          const b = state.pp;
          state.pp = clamp(state.pp + Math.ceil(ppMax() * info.prayer), 0, Math.max(ppMax(), state.pp));
          msg = `+${state.pp - b} prayer (${state.pp})`;
        } else if (info.brew) {
          const b = state.hp;
          state.hp = clamp(state.hp + 20, 0, Math.max(hpMax(), state.hp));
          state.effects = state.effects.filter(e => e.label !== "Saradomin brew");
          for (const k of ["attack", "strength", "defense", "ranged", "magic"]) state.effects.push({ label: "Saradomin brew", stat: k, amt: -20, turns: 2, potion: true });
          msg = `+${state.hp - b} HP, combat stats −20 for 2 turns`;
        }
        return `Drank ${it.name}: ${msg} · ${it.qty} dose${it.qty === 1 ? "" : "s"} left`;
      });
      toast(`${it.name}: ${msg}`);
    },
    "wield": arg => {

    "unwear": arg => {

    },
    "effect-add": () => {
      const k = ui.effStat, amt = ui.effAmt | 0;
      if (!state.stats[k] || !amt) { toast("Set an amount first"); return; }
      mutate(() => { state.effects.push({ label: "Custom", stat: k, amt, turns: Math.max(0, ui.effTurns | 0) }); return `Custom effect: ${STAT_NAME[k]} ${fmt(amt)}`; });
    },
    "effect-remove": arg => {
      const i = toInt(arg), e = state.effects[i];
      if (!e) return;
      mutate(() => { state.effects.splice(i, 1); return `${e.label} removed`; });
    },
    "buy": arg => {
      const shop = SHOPS[clamp(ui.shop | 0, 0, SHOPS.length - 1)];
      const it = shop.items[toInt(arg)];
      if (!it) return;
      const q = Math.max(1, ui.buyQty | 0), cost = it.p * q;
      if (state.gp < cost) { toast(`That costs ${cost}gp. You have ${state.gp}gp.`); return; }
      mutate(() => {
        state.gp -= cost;
        if (it.rune) state.runes[it.rune] = (state.runes[it.rune] | 0) + q;
        else {
          const have = state.items.find(x => x.name.toLowerCase() === it.n.toLowerCase());
          if (have) have.qty = (have.qty | 0) + q; else state.items.push({ name: it.n, qty: q });
        }
        return `Bought ${q} ${it.n} at ${shop.n} for ${cost}gp (${state.gp}gp left)`;
      });
      toast(`Bought ${q} ${it.n} for ${cost}gp`);
    },
    "item-food": arg => { const it = state.items[toInt(arg)]; if (it) mutate(() => { it.heal = ""; return null; }); },
    "item-remove": arg => {
      const i = toInt(arg), it = state.items[i];
      if (!it) return;
      mutate(() => { state.items.splice(i, 1); return `Removed ${it.name}`; });
    },
    "item-add": () => {
      const name = ui.newItem.trim();
      if (!name) { toast("Type an item name first"); return; }
      ui.newItem = "";
      const known = ITEM_LIST.find(i => i.n.toLowerCase() === name.toLowerCase()) || weaponInfo(name);
      const nm = known ? known.n : name;
      const q = known && known.kind === "potion" ? 2 : 1;
      mutate(() => {
        const have = state.items.find(x => x.name.toLowerCase() === nm.toLowerCase());
        if (have) have.qty = (have.qty | 0) + q; else state.items.push({ name: nm, qty: q });
        return `Added ${nm}${q > 1 ? ` (${q} doses)` : ""}`;

    "skill-add": () => {

    "dice": arg => {

      if (pen && state.lastRoll) state.lastRoll.label += ` incl. −${pen} exhaustion`;
      log(`Rolled ${r}${pen ? ` (incl. −${pen} exhaustion)` : ""}`);

      if (!ui.resetArm) {
        ui.resetArm = true; render();

        return;
      }
      ui.resetArm = false;
      ui.newName = state.name || "";
      snapshot();
      state = freshState(null);
      persist(); render(); toast("Pick a class. \"Back to my character\" undoes this.");
    }
  };

  function onField(field, raw) {
    const [f, arg] = field.split(":");
    const n = toInt(raw);
    snapshot();
    let msg = null;
    switch (f) {
      case "name": state.name = String(raw).slice(0, 40); break;
      case "hp": state.hp = Math.max(0, n); break;
      case "pp": state.pp = Math.max(0, n); break;
      case "spec": state.spec = clamp(n, 0, 100); break;
      case "gp": state.gp = Math.max(0, n); break;
      case "weapon": msg = wieldByName(String(raw)); break;
      case "rune": if (arg in state.runes) state.runes[arg] = Math.max(0, n); break;
      case "stat-base": if (state.stats[arg]) state.stats[arg].base = n; break;
      case "item-name": if (state.items[+arg]) state.items[+arg].name = String(raw).slice(0, 60); break;
      case "item-qty": if (state.items[+arg]) state.items[+arg].qty = Math.max(0, n); break;
      case "item-heal": if (state.items[+arg]) state.items[+arg].heal = String(raw).trim() === "" ? "" : Math.max(0, n); break;
      case "skill-name": if (state.skills[+arg]) state.skills[+arg].name = String(raw).slice(0, 40); break;
      case "skill-pts": if (state.skills[+arg]) state.skills[+arg].pts = clamp(n, 0, 30); break;
      case "notes": state.notes = String(raw); break;
      default: history.pop(); return;
    }
    if (msg) log(msg);
    persist();
    setTimeout(render, 0);
  }

  /* ================= Events ================= */
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const fn = handlers[b.dataset.act];
    if (fn) fn(b.dataset.arg);
  });

  document.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset && el.dataset.field && el.dataset.field !== "notes") onField(el.dataset.field, el.value);
  });

  const TEXT_UI = new Set(["newItem", "newSkill", "newName", "wearPick", "effStat", "caName", "ammo", "allyPick", "allyWho", "joinCode", "target", "allyTo", "enName",
    "bestQ", "bestText", "bName", "bAtk", "bDmg", "bNotes", "bAc", "enAc", "bInit", "bATT", "bSTR", "bRNG", "bMGC", "bPRA", "bAGI"]);
  let textT = null;
  document.addEventListener("input", e => {
    const el = e.target;
    if (el.dataset && el.dataset.enspell) { ui.enSpell[el.dataset.enspell] = el.value; return; }
    if (el.dataset && el.dataset.edraft && ui.enDraft) {
      const key = el.dataset.edraft;
      if (!key.includes(":")) { ui.enDraft[key] = el.value; return; }
      const [i, k] = key.split(":"), a = ui.enDraft.actions[toInt(i)];
      if (!a) return;
      a[k] = el.value;
      if (k === "k") { if (a.k === "attack" && (a.hit === undefined || a.hit === null || a.hit === "")) a.hit = "+0"; setTimeout(render, 0); }
      return;
    }
    if (el.dataset && el.dataset.ui) {
      const k = el.dataset.ui;
      ui[k] = el.type === "checkbox" ? el.checked : TEXT_UI.has(k) ? el.value : toInt(el.value);
      if (el.tagName === "SELECT" || el.type === "checkbox" || k === "buyQty" || k === "bQty" || k === "bestQ") setTimeout(render, 0);
      return;
    }
    if (el.dataset && el.dataset.field === "notes") {
      state.notes = el.value;
      clearTimeout(textT);
      textT = setTimeout(persist, 500);
    }
  });

  document.addEventListener("keydown", e => {
    const el = e.target;
    if (e.key !== "Enter" || !el.dataset) return;
    if (el.dataset.ui === "newItem") { e.preventDefault(); handlers["item-add"](); }
    if (el.dataset.ui === "newSkill") { e.preventDefault(); handlers["skill-add"](); }
    if (el.dataset.ui === "allyWho") { e.preventDefault(); handlers["ally-add"](); }
    if (el.dataset.ui === "joinCode") { e.preventDefault(); handlers.join(); }
    if (el.dataset.ui === "enName") { e.preventDefault(); handlers["en-add"](); }
  });

  // Answers from the playtest chat for things the PDFs don't say. The PDFs win wherever they do say.
  const FAQ = [
    ["How do my stat levels turn into bonuses?", "Every 10 levels in a stat gives +1 to its modifiers. Magic 37 gives +3 to hit and damage with spells, and Defense 10 gives +1 to all three ACs."],
    ["Which stats do melee attacks use?", "To-hit comes from Attack and damage from Strength. Spells use Magic for both."],
    ["How do saving throws work?", "The same for players as for enemies: d20 + the stat's bonus against the DC. A STR 10 save is d20 + your Strength bonus, and an AGI save uses your Agility life skill."],
    ["What if a save names a D&D stat like DEX, CON, WIS or CHA?", "Use Grei's stat in its place: DEX is an AGI save, CON is an Attack save, WIS is a Magic save and CHA is a Prayer save."],
    ["Do life skills give a bonus?", "Yes, +1 per 10 points, like stats. 20 points in Thieving gives +2."],
    ["How much does Agility add to initiative?", "LIFE SKILLS says Agility affects initiative but not by how much. The sheet uses the usual +1 per 10 Agility points, plus +3 for a Ranger's Woodsman. Nothing else adds to initiative. Grei hasn't confirmed the Agility amount yet."],
    ["Which spells are bonus actions?", "Any spell that doesn't deal damage, including Curse, Confuse, Bind, Barrier and Bones to Bananas."],
    ["How does exhaustion work?", "Like D&D 2024: each level gives −2 to every d20 roll and −5 ft speed, and level 6 is death. It doesn't affect AC. A long rest clears it."],
    ["What's my speed?", "30 ft. Each platebody or platelegs piece takes off 5 ft (both together is −10 ft), and so does each level of exhaustion."],
    ["What happens at 0 HP?", "You make D&D death saves."],
    ["What does bloodied mean?", "An enemy at half HP or less, or whenever the DM says so. It matters for Blood for Bandos."],
    ["What do I start with?", "Prayer points equal to your Prayer level, and 100% special attack energy."],
    ["Do level boosts unlock higher spells?", "Yes. Boost, potions and amulets unlock spells while they last, and they stack: Boost + a magic potion is +30 Magic."],
    ["What does a long rest do without a bedroll or inn?", "It restores prayer, special energy and exhaustion, but you don't heal."],
    ["Does a bedroll heal?", "Yes. GENERAL RULES says a long rest on a bedroll fully restores everything, which is the newer rule. ITEMS still has the old line saying it doesn't heal HP."],
    ["How do the inn's temporary hitpoints work?", "They sit on top of your max HP and go first when you take damage. The advantage on hit rolls lasts your first round of combat. On the sheet, ending your turn uses it up."],
    ["How many slots do things take?", "Like OSRS: each item takes a slot, and stackables (runes, arrows, gp) take one slot per type however many you have."],
    ["How much does a banana heal?", "5 HP. ITEMS was updated to 5, but the Bones to Bananas spell text still says 3."],
    ["Does a prayer potion round up?", "Yes. 25% of 15 prayer points restores 4."],
    ["How does the holy symbol work with several prayers?", "Each active prayer costs 1 less per turn, so two prayers save 2 points a turn."],
    ["How do the priest's discounts add up?", "Prayers on yourself cost 50%, and prayers on allies cost 75%. They don't stack into a bigger discount. The sheet rounds halves up, which Grei hasn't confirmed yet."],
    ["Who can put prayers on other players?", "Only priests, and they can put any prayer they know on an ally."],
    ["What do battlestaffs do?", "A battlestaff's +4 is added to spells of its element, and it gives unlimited runes of that element like a basic staff. The dust battlestaff counts as both air and earth."],
    ["What does Warcry double?", "Your Strength level, for 2 turns."],
    ["Does Armadyl's Precision work with spells?", "No, only ranged weapon attacks. With Triple Knock each arrow gets it, and each one uses up an arrow."],
    ["Do I get my arrows back?", "That's up to the DM."],
    ["How often can I use Surging Power?", "As often as you like. The 2 levels of exhaustion each time are the limit."],
    ["Which races can I play?", "Humans only for now."]
  ];
