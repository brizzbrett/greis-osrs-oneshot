    ].concat(["Wizard", "Warrior", "Ranger", "Priest", "General"].map(c => ({
      h: c === "General" ? "General gear" : c + " armour", src: ARMOUR_SRC[c],
      rows: ARMOUR.filter(a => a.c === c).map(a => [a.n, acText(a)])
    }))) },
    { id: "equipment", tab: "Weapons", sections: [
      { h: "Weapon special attacks", src: "RUNE WEAPONSTATS.pdf", rows: [
        ["Daggers", "Double Hit – 25%: hits twice"],
        ["Longswords", "Cleave – 40%: deals 1d8 extra dmg"],
        ["Maces", "Shatter – 30%: lowers enemy melee AC by 50% for 2 turns"],
        ["Battleaxes", "Warcry – 100%: doubles player strength for 2 turns"],
        ["2H swords", "Sweep – 50%: deals damage in a cone in front of you"],
        ["Spears", "Shove – 30%: STR 10 saving throw to push enemy 20 feet"],
        ["Shortbows", "Triple Knock – 50%: shoots 3 arrows, each roll to hit and dmg"],
        ["Longbows", "Power Shot – 60%: deals 1d12 extra damage"],
        ["Crossbows", "Pierce – 50%: pierces up to two enemies, deals extra 1d6 dmg"],
        ["Staves", "Boost – 50%: raises magic level by 15 for 2 turns"]
      ] },
      { h: "Weapons", src: "RUNE WEAPONSTATS.pdf", rows: [
        ["Iron dagger", "1d4"], ["Iron longsword", "1d6"], ["Steel longsword", "1d8"], ["Steel mace", "2d4"],
        ["Steel battleaxe", "1d10"], ["Steel 2H sword", "2d6"], ["Mithril 2H sword", "2d6 + 3"], ["Mithril hasta", "1d10, extra reach"],
        ["Oak shortbow", "1d6"], ["Willow shortbow", "1d8"], ["Maple longbow", "1d12"], ["Steel crossbow", "2d6"],
        ["Staff of air", "1d4 (inf. air runes)"], ["Staff of water", "1d4 (inf. water runes)"], ["Staff of earth", "1d4 (inf. earth runes)"], ["Staff of fire", "1d4 (inf. fire runes)"],
        ["Air battlestaff", "1d6 +4 air dmg"], ["Water battlestaff", "1d6 +4 water dmg"], ["Earth battlestaff", "1d6 +4 earth dmg"], ["Fire battlestaff", "1d6 +4 fire dmg"],
        ["Dust battlestaff", "1d8 (air/earth)"]
      ] }
    ] },
    { id: "items", tab: "Items", sections: [
      { h: "Items", src: "ITEMS.pdf", rows: [
        ["Bread roll", "Heals 6 HP"], ["Trout", "Heals 10 HP"], ["Banana", "Heals 5 HP"], ["Tuna", "Heals 15 HP"],
        ["Strength potion", "Boosts strength by 15 for 2 turns"], ["Ranged potion", "Boosts ranged by 15 for 2 turns"],
        ["Magic potion", "Boosts magic by 15 for 2 turns"], ["Defense potion", "Boosts defense by 15 for 2 turns"],
        ["Prayer potion", "Restores 25% of your prayer points"],
        ["Saradomin brew", "Heals 20HP but drains all combat stats by 20 for 2 turns"],
        ["Imp repellent", "Imps hate it"],
        ["General tools", "Chisel, hammer, spade, pestle and mortar, bucket, knife, lockpick, needle and thread, tinderbox, pickaxes, axes"],
        ["Bedroll", "Can be used to long rest but doesn't heal HP"]
      ] }
    ] },
    { id: "shops", tab: "Shops", sections: SHOPS.map(s => ({ h: s.n, src: "SHOPS.pdf", rows: s.items.map(it => [it.n, `${it.p}gp${it.desc ? " · " + it.desc : ""}`]) })) },
    { id: "skills", tab: "Life skills", sections: [{ h: "Life skills", src: "LIFE SKILLS.pdf", rows: LIFE_SKILLS.map(([n, dsc]) => [n, dsc]) }] },
    { id: "prayer", tab: "Prayer", sections: [
      { h: "Prayer effects", src: "PRAYER.pdf", rows: [
        ["Rock Skin", "Drains 4 pp per turn, adds 6 melee AC"],
        ["Steel Skin", "Drains 6 pp per turn, adds 10 melee AC"],
        ["Protect from Melee", "Drains 10 pp per turn, enemy has disadvantage on melee attacks and gives resistance to melee dmg"],
        ["Burst of Strength", "Drains 4 pp per turn, adds +3 melee dmg"],
        ["Superhuman Strength", "Drains 8 pp per turn, adds +6 melee dmg"],
        ["Quick Reflexes", "Drains 4 pp per turn, adds 6 ranged AC"],
        ["Lightning Reflexes", "Drains 6 pp per turn, adds 10 ranged AC"],
        ["Protect from Ranged", "Drains 10 pp per turn, enemy has disadvantage on ranged attacks and gives resistance to ranged dmg"],
        ["Sharp Eye", "Drains 4 pp per turn, adds +3 ranged dmg"],
        ["Eagle Eye", "Drains 8 pp per turn, adds +6 ranged dmg"],
        ["Mystic Hide", "Drains 4 pp per turn, adds 6 magic AC"],
        ["Mystic Barrier", "Drains 6 pp per turn, adds 10 magic AC"],
        ["Protect from Magic", "Drains 10 pp per turn, enemy has disadvantage on magic attacks and gives resistance to magic dmg"],
        ["Learned Mind", "Drains 4 pp per turn, adds +3 magic dmg"],
        ["Arcane Mind", "Drains 8 pp per turn, adds +6 magic dmg"],
        ["Redemption", "Drains 6 pp per turn and all points upon activating, heals 50% HP when player falls below 20% HP"],
        ["Retribution", "Drains 8 pp per turn, player explodes upon death dealing 8d6 fire dmg in a 15 foot radius losing one death save"],
        ["Preserve", "Drains 6 pp per turn, stops a potion's effect from draining during use"],
        ["Rapid Regeneration", "Drains 8 pp per turn, regenerates 5 HP per turn"]
      ] },
      { h: "Prayer levels", src: "PRAYER 2.pdf", levels: PRAYERS.map(p => [p.l, p.n]) }
    ] },
    { id: "spellbook", tab: "Spellbook", sections: [
      { h: "Spells", src: "SPELLBOOK.pdf", rows: [
        ["Wind Strike", "1d6 + spell mod (5 foot knockback)", "Mind + Air"],
        ["Water Strike", "1d6 + spell mod (halves movement for 2 turns)", "Mind + Water"],
        ["Earth Strike", "1d8 + spell mod", "Mind + Earth"],
        ["Fire Strike", "1d6 + spell mod (AGI 10 save 1d4 extra fire dmg)", "Mind + Fire"],
        ["Barrier", "Reduce the next instance of dmg by 1d8", "Law + 3 Mind + 2 Body"],
        ["Confuse", "Prayer 10 save (charmed for 2 turns)", "2 Body + 2 Mind"],
        ["Curse", "HP 10 save (disadvantage on attack rolls for 2 turns)", "2 Body + Nature"],
        ["Bind", "STR 10 save (bound for 3 turns, can save each turn)", "3 Earth + Nature"],
        ["Bones to Bananas", "Turns bones to bananas, cannot be used on a living target, bananas heal 3 HP", "3 Earth + Body + Nature"],
        ["Wind Bolt", "1d10 + spell mod (10 foot knockback)", "Chaos + 5 Air"],
        ["Identify Monster", "Reveals a monster's weakness", "3 Body + 3 Mind"],
        ["Water Bolt", "1d10 + spell mod (halves movement for 3 turns)", "Chaos + 5 Water"],
        ["Earth Bolt", "1d12 + spell mod (STR 10 save or knocked prone)", "Chaos + 5 Earth"],
        ["Fire Bolt", "1d10 + spell mod (AGI 13 save 1d6 extra fire dmg)", "Chaos + 5 Fire"],
        ["Telekinetic Grab", "Grabs an object up to 30 feet away", "Law + 10 Air"],
        ["Superheat Item", "Heats item, melts metal, if used on an enemy works like Heat Metal", "Nature + 10 Fire"],
        ["Magic Dart", "2d8 + spell mod (advantage to hit)", "Chaos + 5 Mind"],
        ["Greater Barrier", "Reduce the next instance of dmg by 2d6", "2 Law + 2 Chaos + 5 Body"],
        ["Wind Blast", "2d8 + spell mod (15 foot knockback)", "Death + 10 Air"],
        ["Water Blast", "2d8 + spell mod (halves movement for 5 turns)", "Death + 10 Water"],
        ["Earth Blast", "2d10 + spell mod (STR 10 save or stunned for 1 turn)", "Death + 10 Earth"],
        ["Fire Blast", "2d8 + spell mod (AGI 15 save or 1d8 extra fire dmg)", "Death + 10 Fire"],
        ["Entangle", "STR 14 save (bound for 5 turns, can save each turn)", "10 Earth + 3 Nature"],
        ["Enfeeble", "HP 14 save (disadvantage on attacks for 3 turns)", "10 Body + 5 Nature"]
      ] },
      { h: "Spell levels", src: "SPELLBOOK 2.pdf", levels: SPELLS.map(s => [s.l, s.n]) }
    ] }
  ];

  let rulesTab = "general";
  const rulesEl = document.getElementById("rules");
  const rulesBody = document.getElementById("rules-body");
  const rulesTabs = document.getElementById("rules-tabs");
  const rulesQ = document.getElementById("rules-q");

  function hl(text, q) {
    const s = esc(text);
    if (!q) return s;
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    return s.replace(re, "<mark>$1</mark>");
  }
  const rowText = r => (Array.isArray(r) ? r.join(" ") : r);

  function renderSection(sec, q) {
    const ql = q.toLowerCase();
    const match = t => !q || t.toLowerCase().includes(ql);
    let inner = "";
    if (sec.rows) {
      const rows = sec.rows.filter(r => match(rowText(r)));
      if (!rows.length) return "";
      inner = `<ul class="rlist">${rows.map(r => Array.isArray(r)
        ? `<li><b>${hl(r[0], q)}</b> – ${hl(r[1], q)}${r[2] ? `<span class="rcost">Runes: ${hl(r[2], q)}</span>` : ""}</li>`
        : `<li>${hl(r, q)}</li>`).join("")}</ul>`;
    } else if (sec.faq) {
      const rows = sec.faq.filter(([qq, a]) => match(qq + " " + a));
      if (!rows.length) return "";
      inner = `<dl class="faq">${rows.map(([qq, a]) => `<div><dt>${hl(qq, q)}</dt><dd>${hl(a, q)}</dd></div>`).join("")}</dl>`;
    } else if (sec.levels) {
      const rows = sec.levels.filter(([l, n]) => match(n + " level " + l));
      if (!rows.length) return "";
      inner = `<ul class="rlist">${rows.map(([l, n]) => `<li><span class="rlvl">${l}</span>${hl(n, q)}</li>`).join("")}</ul>`;
    } else if (sec.classes) {
      const cls = sec.classes.filter(c => match([c.n, c.equip, c.prof, c.ab.map(a => a.join(" ")).join(" ")].join(" ")));
      if (!cls.length) return "";
      inner = cls.map(c => {
        const mine = c.k === state.cls;
        return `<div class="cls${mine ? " mine" : ""}">
          <h4>${hl(c.n, q)}${mine ? ` <span class="src">your class</span>` : ""}</h4>
          <div class="cls-stats">${c.stats.map(([k, v]) => `<span>${k}<span class="num">${v}</span></span>`).join("")}</div>
          <p><span class="label">Starting equipment</span><br>${hl(c.equip, q)}</p>
          ${c.note ? `<p class="small muted"><em>${hl(c.note, q)}</em></p>` : ""}
          <p>${hl(c.prof, q)}</p>
          ${c.ab.map(([a, t]) => `<p><b>${hl(a, q)}:</b> ${hl(t, q)}</p>`).join("")}
        </div>`;
      }).join("");
    }
    return `<section class="rsec"><h3>${esc(sec.h)}<span class="src">${esc(sec.src)}</span></h3>${sec.intro ? `<p class="rintro">${esc(sec.intro)}</p>` : ""}${inner}</section>`;
  }

  function renderRules() {
    const q = rulesQ.value.trim();
    rulesTabs.innerHTML = RULEBOOK.map(dd => `<button type="button" role="tab" id="rt-${dd.id}" data-rtab="${dd.id}" aria-selected="${!q && dd.id === rulesTab}">${dd.tab}</button>`).join("");
    const docs = q ? RULEBOOK : RULEBOOK.filter(dd => dd.id === rulesTab);
    const html = docs.map(dd => dd.sections.map(s => renderSection(s, q)).join("")).join("");
    rulesBody.innerHTML = html || `<p class="empty">Nothing in the rules mentions “${esc(q)}”.</p>`;
  }

  function openRules() { rulesEl.hidden = false; renderRules(); rulesQ.focus(); }
  function closeRules() { rulesEl.hidden = true; const b = document.getElementById("b-rules"); if (b) b.focus(); }
  handlers.rules = () => (rulesEl.hidden ? openRules() : closeRules());
  document.getElementById("rules-close").addEventListener("click", closeRules);
  rulesTabs.addEventListener("click", e => {
    const b = e.target.closest("[data-rtab]");
    if (!b) return;
    rulesTab = b.dataset.rtab; rulesQ.value = ""; renderRules(); rulesBody.scrollTop = 0;
  });
  rulesQ.addEventListener("input", renderRules);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !rulesEl.hidden) closeRules(); });

  // net.js calls this once it has signed in to Firebase
  window.GreisApp = {
    attach(api) {
      net.api = api; net.uid = api.uid; net.status = "ready";
      render(); // show "Play together" straight away; rejoining a saved room redraws again when it's done
      const q = (new URLSearchParams(location.search).get("room") || "").trim().toUpperCase();
      const saved = readRoom();
      if (q && (!saved || saved.code !== q)) openRoom(q, "player", false);
      else if (saved && saved.code) openRoom(saved.code, saved.role === "dm" ? "dm" : "player", true);
      else render();
    },
    failed(err) { net.status = "error"; net.error = (err && (err.code || err.message)) || "unknown error"; render(); }
  };

  /* ================= Boot ================= */
  function start(data) {
    const local = readLocal(KEY) || readLocal(OLD_KEY);
    if (data && data.state) state = migrate(data.state);
    else if (local) state = migrate(local);
    if (state.cls) connecting = false; // a sheet is already showing; the account copy can replace it if newer
    render();
    connect();
    // If net.js never reports in (blocked or offline), say so instead of "Connecting…" forever
    if (STANDALONE) setTimeout(() => {
      if (!net.api && net.status === "connecting") { net.status = "error"; net.error = "no answer after 15 seconds"; render(); }
    }, 15000);
  }
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function") {
    window.claude.hot.snapshot(() => ({ state }));
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
<script>
  // Load the session code with a dynamic import so any failure (blocked by an ad/tracker blocker,
  // offline, opened as a file) is caught and shown, instead of leaving "Connecting…" on screen.
  import("./net.js").catch(function (err) {
    if (window.GreisApp) window.GreisApp.failed({ message: "blocked or offline: " + ((err && err.message) || "couldn't load") });
  });
</script>
</body>
</html>
